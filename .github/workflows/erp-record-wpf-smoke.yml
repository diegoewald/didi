name: ERP Record WPF Smoke Milestone

on:
  push:
    branches:
      - erp-wpf-smoke
    paths:
      - '.github/workflows/erp-record-wpf-smoke.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update project documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          backlog = 'local-erp/tasks/BACKLOG.md'
          replace_exact(
              backlog,
              '- [ ] executar smoke visual/interativo do WPF em Windows real, incluindo Solicitação de Compra, RFQ, Comparação de Cotações e Adjudicação;',
              '- [x] executar smoke automatizado do WPF no CI Windows cobrindo bootstrap, autenticação, shell, abas de Compras e logout com banco descartável;\n- [ ] executar smoke visual/interativo manual do WPF em Windows real, incluindo Solicitação de Compra, RFQ, Comparação de Cotações, Adjudicação e Pedido de Compra;')
          replace_exact(
              backlog,
              '- [ ] teste automatizado de UI somente para fluxos cujo custo se justificar.',
              '- [x] smoke automatizado mínimo de UI para bootstrap, autenticação, shell e navegação básica de Compras;\n- [ ] ampliar automação de UI somente para fluxos cujo custo de manutenção se justificar.')
          replace_exact(
              backlog,
              'Baseline automatizado atual: **270/270 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 6), **17 migrations**, build Release e benchmark tool com 0 warnings/erros, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validados no CI Windows.',
              'Baseline automatizado atual: **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), **17 migrations**, build Release e benchmark tool com 0 warnings/erros, smoke WPF automatizado, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validados no CI Windows.')

          roadmap = 'local-erp/docs/ROADMAP.md'
          replace_exact(
              roadmap,
              '- [ ] smoke visual/interativo em Windows real.',
              '- [x] smoke WPF automatizado no CI Windows para bootstrap, autenticação, shell, abas de Compras e logout;\n- [ ] smoke visual/interativo manual em Windows real.')
          p = Path(roadmap)
          text = p.read_text(encoding='utf-8')
          marker = '## Marco do smoke WPF automatizado — 2026-10-23'
          if marker not in text:
              section = ('\n\n## Marco do smoke WPF automatizado — 2026-10-23\n\n'
                         'O CI Windows passou a executar `scripts/smoke-wpf.ps1` com um diretório `LOCALERP_DATA_ROOT` temporário e banco SQLite descartável. O gate aplica as migrations reais, abre o executável WPF e valida por UI Automation o bootstrap do primeiro administrador, a autenticação automática pós-bootstrap, a abertura da `MainWindow`, a navegação por `Compras` e pelas abas `Solicitações`, `Cotações` e `Pedidos`, logout, login explícito e retorno ao shell.\n\n'
                         'O baseline subiu para **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), mantendo 17 migrations e snapshot EF limpo. Esse smoke reduz regressões de startup/composição/navegação, mas não substitui o smoke visual/interativo manual de ergonomia, foco, DPI e do fluxo completo com Comparação, Adjudicação e mutações de Pedido de Compra.')
              p.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          testing = 'local-erp/docs/TESTING.md'
          replace_exact(testing, '## Baseline atual — 2026-10-22', '## Baseline atual — 2026-10-23')
          replace_exact(testing, '- Domain: **69/69**', '- Domain: **75/75**')
          replace_exact(testing, '- Application: **124/124**', '- Application: **130/130**')
          replace_exact(testing, '- Persistence: **54/54**', '- Persistence: **59/59**')
          replace_exact(testing, '- Infrastructure: **6/6**', '- Infrastructure: **7/7**')
          replace_exact(testing, '- Total: **253/253**', '- Total: **271/271**')
          replace_exact(testing, '- migration smoke com **16 migrations** em `apply -> rollback 0 -> reapply`.', '- migration smoke com **17 migrations** em `apply -> rollback 0 -> reapply`.')
          p = Path(testing)
          text = p.read_text(encoding='utf-8')
          marker = '### Smoke WPF automatizado'
          if marker not in text:
              insert_before = '## Cobertura funcional automatizada atual'
              section = ('### Smoke WPF automatizado\n\n'
                         'Depois da suíte, o CI Windows executa `scripts/smoke-wpf.ps1`. O script usa `LOCALERP_DATA_ROOT` para isolar todos os dados em um diretório temporário, aplica as migrations reais em um banco descartável e usa Windows UI Automation para percorrer bootstrap -> Main -> Compras -> Solicitações/Cotações/Pedidos -> logout -> login explícito -> Main -> logout. O log precisa registrar as rotas de startup esperadas e não pode conter entrada fatal.\n\n'
                         'Esse gate valida inicialização, DI, autenticação e navegação básica, mas não substitui o smoke manual de ergonomia, foco, DPI ou o fluxo completo de Compras com dados. Detalhes: `docs/WPF-SMOKE.md`.\n\n')
              if insert_before not in text:
                  raise RuntimeError('TESTING insertion marker not found')
              p.write_text(text.replace(insert_before, section + insert_before, 1), encoding='utf-8')

          changelog = 'local-erp/CHANGELOG.md'
          replace_exact(
              changelog,
              '- fundação .NET 10/WPF, SQLite/EF Core, WAL e tooling de migrations;',
              '- fundação .NET 10/WPF, SQLite/EF Core, WAL e tooling de migrations;\n- smoke WPF automatizado no CI Windows com dados descartáveis, cobrindo bootstrap, autenticação, shell, abas básicas de Compras e logout;')
          replace_exact(changelog, '- suíte automatizada: 253/253;', '- suíte automatizada: 271/271;')
          replace_exact(changelog, '- Domain 69/69, Application 124/124, Persistence 54/54, Infrastructure 6/6;', '- Domain 75/75, Application 130/130, Persistence 59/59, Infrastructure 7/7;')
          replace_exact(changelog, '- 16 migrations: apply -> rollback 0 -> reapply passando;', '- 17 migrations: apply -> rollback 0 -> reapply passando;')
          replace_exact(
              changelog,
              '- CI #188 validou Adjudicação manual de RFQ, compilação WPF, 253/253 testes, snapshot EF limpo e 16 migrations;',
              '- CI #188 validou Adjudicação manual de RFQ, compilação WPF, 253/253 testes, snapshot EF limpo e 16 migrations;\n- CI técnico #199 validou o smoke WPF automatizado, 271/271 testes, snapshot EF limpo e 17 migrations em apply -> rollback 0 -> reapply;')
          replace_exact(
              changelog,
              '- smoke visual/interativo em Windows real permanece obrigatório antes de release.',
              '- smoke WPF automatizado está integrado ao CI; smoke visual/interativo manual em Windows real permanece obrigatório antes de release.')
          PY

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/erp-record-wpf-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/tasks/BACKLOG.md \
                  local-erp/docs/ROADMAP.md \
                  local-erp/docs/TESTING.md \
                  local-erp/CHANGELOG.md
          git commit -m "docs(wpf): record automated smoke milestone"
          git push origin HEAD:erp-wpf-smoke
