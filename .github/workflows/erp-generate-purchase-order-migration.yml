name: ERP Purchase Order Migration Generator

on:
  push:
    branches:
      - erp-purchase-order-persistence
    paths:
      - 'local-erp/**'
      - '.github/workflows/erp-generate-purchase-order-migration.yml'

permissions:
  contents: write

concurrency:
  group: erp-purchase-order-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate purchase order migration
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: local-erp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF tool
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore LocalErp.sln

      - name: Build Release before migration
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Generate AddPurchaseOrders migration when missing
        shell: pwsh
        run: |
          $migration = Get-ChildItem 'src/LocalErp.Persistence/Migrations' -Filter '*_AddPurchaseOrders.cs' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $migration) {
            dotnet ef migrations add AddPurchaseOrders --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext --output-dir Migrations
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Migration already committed: $($migration.Name)"
          }

      - name: Verify generated snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Run tests against generated migration
        run: dotnet test LocalErp.sln --configuration Release --logger "trx;LogFileName=tests.trx"

      - name: Reset disposable database
        shell: pwsh
        working-directory: .
        run: Remove-Item (Join-Path $env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Apply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Roll back to zero
        run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reapply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Commit generated migration
        if: success()
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/src/LocalErp.Persistence/Migrations
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated migration changes to commit."
            exit 0
          }
          git commit -m "feat(purchases): add purchase order migration"
          git push origin HEAD:erp-purchase-order-persistence

      - name: Upload generated migrations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: purchase-order-generated-migrations
          path: local-erp/src/LocalErp.Persistence/Migrations
          if-no-files-found: error
          retention-days: 2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: purchase-order-migration-test-results
          path: local-erp/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 2
