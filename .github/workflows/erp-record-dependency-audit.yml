name: ERP Record Dependency Audit Milestone

on:
  push:
    branches:
      - erp-dependency-audit
    paths:
      - '.github/workflows/erp-record-dependency-audit.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-dependency-audit
          fetch-depth: 0

      - name: Update project documentation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'local-erp/README.md',
              '- CI Windows: build Release com 0 warnings / 0 errors, 271/271 testes, smoke WPF e smoke do pacote publicado passando',
              '- CI Windows: build Release com 0 warnings / 0 errors, 271/271 testes, auditoria NuGet direta/transitiva, smoke WPF e smoke do pacote publicado passando'
          )
          replace(
              'local-erp/README.md',
              './scripts/benchmark-password-hashing.ps1\n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64',
              './scripts/benchmark-password-hashing.ps1\n./scripts/check-vulnerable-packages.ps1\n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64'
          )

          replace(
              'local-erp/docs/SECURITY.md',
              '- ações administrativas auditáveis.\n\n## Password hashing e política de senha',
              '''- ações administrativas auditáveis.\n\n## Dependências e supply chain\n\nA auditoria de pacotes NuGet é política explícita do repositório. `Directory.Build.props` mantém `NuGetAudit=true`, `NuGetAuditMode=all` e `NuGetAuditLevel=low`, portanto referências diretas e transitivas entram na verificação desde a menor severidade reportada.\n\n`NU1901` a `NU1904` permanecem warnings durante restore/build mesmo com `TreatWarningsAsErrors`, porque o gate dedicado `scripts/check-vulnerable-packages.ps1` é a autoridade do CI: ele consulta `dotnet package list --vulnerable --include-transitive` em JSON e falha se existir qualquer advisory conhecido. O CI também injeta um relatório sintético vulnerável e exige que ele seja rejeitado, evitando um gate que passe apenas por erro de parser ou configuração.\n\nNão há supressão geral de advisories. Uma vulnerabilidade nova deve ser resolvida por atualização/remoção da dependência ou, se uma exceção específica algum dia for necessária, por decisão de risco documentada e restrita ao advisory correspondente.\n\n## Password hashing e política de senha'''
          )

          replace(
              'local-erp/docs/TESTING.md',
              'Executa restore, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, smoke WPF, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply.',
              'Executa restore, auditoria NuGet direta/transitiva com gate de rejeição sintética, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, smoke WPF, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply.'
          )
          replace(
              'local-erp/docs/TESTING.md',
              '- Benchmark tool: 0 warnings / 0 errors;\n- EF Core: sem mudanças pendentes no modelo;',
              '- Benchmark tool: 0 warnings / 0 errors;\n- NuGet audit: nenhuma vulnerabilidade conhecida em dependências diretas ou transitivas; fixture sintética vulnerável rejeitada pelo gate;\n- EF Core: sem mudanças pendentes no modelo;'
          )
          replace(
              'local-erp/docs/TESTING.md',
              '### Smoke WPF automatizado',
              '''### Auditoria NuGet automatizada\n\nApós o restore, `scripts/check-vulnerable-packages.ps1 -NoRestore` executa `dotnet package list --vulnerable --include-transitive --format json`, interpreta o relatório e falha se qualquer pacote direto ou transitivo possuir advisory. Projetos limpos podem aparecer no JSON sem coleção `frameworks`; o parser trata essa forma como zero achados sem relaxar validação de relatório ausente ou inválido.\n\nO CI executa ainda uma fixture JSON com uma dependência sintética `high` e considera sucesso somente quando o script a rejeita. O CI técnico #207 validou simultaneamente o caso limpo real e o caminho de falha sintético.\n\n### Smoke WPF automatizado'''
          )

          replace(
              'local-erp/tasks/BACKLOG.md',
              '- [ ] verificação automatizada de dependências vulneráveis;',
              '- [x] verificação automatizada de dependências vulneráveis diretas/transitivas com NuGet Audit e gate JSON no CI;'
          )
          replace(
              'local-erp/tasks/BACKLOG.md',
              'O CI também gera um pacote portátil `win-x64` self-contained com migration bundle, SHA-256, inicializador seguro de banco novo e smoke executado sobre o binário publicado.',
              'O CI também gera um pacote portátil `win-x64` self-contained com migration bundle, SHA-256, inicializador seguro de banco novo e smoke executado sobre o binário publicado. A auditoria NuGet falha diante de qualquer advisory direto ou transitivo conhecido e possui teste sintético do próprio caminho de rejeição.'
          )
          replace(
              'local-erp/tasks/BACKLOG.md',
              'Entre as pendências de engenharia que não exigem nova regra de negócio, a próxima prioridade é a **verificação automatizada de dependências vulneráveis**.',
              'Entre as pendências de engenharia que não exigem nova regra de negócio, a próxima prioridade provável é estabelecer **coverage automatizado com baseline útil**, sem transformar percentual isolado em meta artificial.'
          )

          replace(
              'local-erp/tasks/TECH-DEBT.md',
              '- A verificação automatizada de dependências vulneráveis permanece pendência de engenharia. O package/release portátil de QA já existe e é validado no CI, mas assinatura de código, Velopack e orquestração segura de upgrade de banco existente continuam fora dele e permanecem necessários para distribuição de produção.',
              '- A auditoria automatizada de dependências vulneráveis diretas/transitivas já integra o CI e falha para qualquer advisory conhecido; manter a fonte de auditoria acessível e revisar advisories novos continua parte da manutenção. O package/release portátil de QA já existe e é validado no CI, mas assinatura de código, Velopack e orquestração segura de upgrade de banco existente continuam fora dele e permanecem necessários para distribuição de produção.'
          )

          replace(
              'local-erp/tasks/BUGS.md',
              'ciclo apply -> rollback 0 -> reapply das **17 migrations** e validação do pacote portátil Windows self-contained com migration bundle.',
              'ciclo apply -> rollback 0 -> reapply das **17 migrations**, auditoria NuGet sem vulnerabilidades conhecidas diretas/transitivas e validação do pacote portátil Windows self-contained com migration bundle.'
          )

          replace(
              'local-erp/CHANGELOG.md',
              '- pacote portátil Windows de QA com publicação `win-x64` self-contained, migration bundle, inicializador seguro de banco novo, metadados de release e hashes SHA-256;',
              '- pacote portátil Windows de QA com publicação `win-x64` self-contained, migration bundle, inicializador seguro de banco novo, metadados de release e hashes SHA-256;\n- auditoria automatizada de vulnerabilidades NuGet diretas/transitivas, com parser JSON e teste sintético de rejeição no CI;'
          )
          replace(
              'local-erp/CHANGELOG.md',
              '- benchmark tool: 0 warnings / 0 errors;\n- suíte automatizada: 271/271;',
              '- benchmark tool: 0 warnings / 0 errors;\n- NuGet audit: zero vulnerabilidades conhecidas diretas/transitivas; fixture sintética vulnerável rejeitada;\n- suíte automatizada: 271/271;'
          )
          replace(
              'local-erp/CHANGELOG.md',
              '- CI técnico #204 validou geração do pacote portátil, inicialização de banco novo, recusa de banco existente e smoke WPF sobre o executável/migration bundle publicados;',
              '- CI técnico #204 validou geração do pacote portátil, inicialização de banco novo, recusa de banco existente e smoke WPF sobre o executável/migration bundle publicados;\n- CI técnico #207 validou zero vulnerabilidades NuGet conhecidas, rejeição de uma fixture vulnerável, 271/271 testes e todos os gates de WPF, EF/migrations e package;'
          )

          replace(
              'local-erp/docs/ROADMAP.md',
              '- [x] CI Windows permanente.',
              '- [x] CI Windows permanente;\n- [x] auditoria automatizada de vulnerabilidades NuGet diretas/transitivas no CI.'
          )
          p = Path('local-erp/docs/ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          text += '''\n\n## Marco da auditoria NuGet automatizada — 2026-10-23\n\nO CI passou a executar `scripts/check-vulnerable-packages.ps1` após o restore, usando o relatório JSON de `dotnet package list --vulnerable --include-transitive`. A política explícita usa `NuGetAuditMode=all` e `NuGetAuditLevel=low`; qualquer advisory conhecido, direto ou transitivo, bloqueia o baseline validado.\n\nO CI técnico #207 confirmou que o conjunto real de dependências está sem vulnerabilidades conhecidas e também validou o caminho negativo com uma fixture sintética de severidade `high`, que foi corretamente rejeitada. O mesmo run preservou 271/271 testes, build sem warnings/erros, smoke WPF, snapshot EF, 17 migrations e smoke do pacote publicado.\n'''
          p.write_text(text, encoding='utf-8')

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/README.md local-erp/CHANGELOG.md local-erp/docs/SECURITY.md local-erp/docs/TESTING.md local-erp/docs/ROADMAP.md local-erp/tasks/BACKLOG.md local-erp/tasks/BUGS.md local-erp/tasks/TECH-DEBT.md
          git rm .github/workflows/erp-record-dependency-audit.yml
          git commit -m "docs(security): record NuGet audit milestone"
          git push origin HEAD:erp-dependency-audit
