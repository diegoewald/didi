name: Finalize quotation comparison docs

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/finalize-quotation-comparison-docs.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-local-ci
          fetch-depth: 0

      - name: Update comparison milestone documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          readme = 'local-erp/README.md'
          replace_required(readme,
              '- Fase: segurança/administração e cadastros-base fechados; Fase 7 de Compras em andamento com Solicitação de Compra e Cotação/RFQ operacionais',
              '- Fase: segurança/administração e cadastros-base fechados; Fase 7 de Compras em andamento com Solicitação, Cotação/RFQ e Comparação de Cotações operacionais')
          replace_required(readme,
              '- CI Windows: build Release com 0 warnings / 0 errors e 235/235 testes passando',
              '- CI Windows: build Release com 0 warnings / 0 errors e 238/238 testes passando')
          replace_required(readme,
              'O módulo Compras possui dois slices verticais operacionais: **Solicitação de Compra** e **Cotação/RFQ**. O RFQ nasce de uma Solicitação `Submitted`, seleciona linhas de origem, convida fornecedores, registra e finaliza respostas com preço unitário/data prometida e permite encerramento ou cancelamento. Ele não escolhe vencedor automaticamente e não cria Pedido de Compra.\n\nA próxima frente funcional é **especificar o terceiro slice de Compras antes de nova implementação**, mantendo aprovação, seleção de vencedor e Pedido de Compra fora do código até suas regras serem documentadas. Consulta/retenção operacional da auditoria, smoke WPF em Windows real e benchmark de senha em hardware representativo continuam pendências próprias.',
              'O módulo Compras possui três slices verticais operacionais: **Solicitação de Compra**, **Cotação/RFQ** e **Comparação de Cotações**. O RFQ nasce de uma Solicitação `Submitted`, seleciona linhas de origem, convida fornecedores e registra respostas. A comparação é uma projeção somente leitura que exibe fornecedores convidados, estado das respostas, moedas e ofertas finalizadas por linha, sem converter moedas, ranquear propostas ou escolher vencedor.\n\nA próxima frente funcional é **especificar o quarto slice de Compras antes de nova implementação**, definindo explicitamente como funcionará decisão/adjudicação e sua relação com Pedido de Compra. Aprovação, vencedor persistido e geração de Pedido de Compra permanecem fora do código até essa regra ser documentada. Consulta/retenção operacional da auditoria, smoke WPF em Windows real e benchmark de senha em hardware representativo continuam pendências próprias.')

          spec = 'local-erp/docs/QUOTATION-COMPARISON-SPEC.md'
          replace_required(spec,
              'Status: **Application validada no CI #165; UI WPF implementada e aguardando validação completa**.',
              'Status: **concluído e validado no CI #166**.')
          p = Path(spec)
          text = p.read_text(encoding='utf-8')
          marker = '## 15. Validação observada\n'
          if marker not in text:
              text += '\n## 15. Validação observada\n\nO CI #166 validou o slice completo de comparação com **238/238 testes** (Domain 63, Application 118, Persistence 51, Infrastructure 6), build Release e benchmark tool com 0 warnings/erros, snapshot EF sem mudanças pendentes e as **15 migrations** em apply -> rollback 0 -> reapply. A compilação inclui a janela WPF `QuotationComparisonWindow` e sua integração ao workspace de RFQ.\n\nA validação automatizada não substitui o smoke visual/interativo em Windows real previsto para pré-release.\n'
              p.write_text(text, encoding='utf-8', newline='\n')

          roadmap = 'local-erp/docs/ROADMAP.md'
          replace_required(roadmap,
              '- [ ] compras: especificar o terceiro slice antes de implementar comparação/seleção, aprovação ou Pedido de Compra.',
              '- [x] compras: terceiro slice de Comparação de Cotações especificado em `docs/QUOTATION-COMPARISON-SPEC.md`;\n- [x] compras: projeção Application de comparação somente leitura implementada com `request-for-quotations.read`, respostas `Draft` excluídas das ofertas e ordenação determinística;\n- [x] compras: janela WPF de comparação integrada ao RFQ, com fornecedores, estado/moeda e matriz por linha sem ranking ou seleção automática;\n- [ ] compras: especificar o quarto slice de decisão/adjudicação e sua relação com Pedido de Compra antes de persistir vencedor ou gerar pedido.')
          p = Path(roadmap)
          text = p.read_text(encoding='utf-8')
          marker = '## Marco de Comparação de Cotações — 2026-10-21\n'
          if marker not in text:
              text += '\n## Marco de Comparação de Cotações — 2026-10-21\n\nO terceiro slice vertical de Compras foi implementado como projeção somente leitura sobre RFQ, Solicitação de origem, fornecedores e respostas existentes. `RequestForQuotationComparisonService` exige `request-for-quotations.read`, preserva fornecedores sem resposta, usa somente respostas `Finalized` como ofertas comparáveis e mantém moedas distintas sem conversão ou ranking.\n\nA UI WPF abre `QuotationComparisonWindow` a partir do RFQ selecionado e apresenta cabeçalho, fornecedores convidados e matriz por linha com preço/data prometida, sem qualquer comando de adjudicação, aceite ou geração de Pedido de Compra. Nenhuma entidade, tabela, coluna ou migration foi adicionada por este slice.\n\nO CI #166 validou **238/238 testes** (Domain 63, Application 118, Persistence 51, Infrastructure 6), build Release e benchmark tool com 0 warnings/erros, snapshot EF limpo e 15 migrations em apply -> rollback 0 -> reapply.\n\nA próxima prioridade funcional é especificar o quarto slice de **decisão/adjudicação** e sua relação com **Pedido de Compra**, incluindo granularidade da escolha, possibilidade de múltiplos fornecedores, justificativa/histórico e transição para pedido, antes de persistir qualquer decisão.\n'
              p.write_text(text, encoding='utf-8', newline='\n')

          backlog = 'local-erp/tasks/BACKLOG.md'
          replace_required(backlog,
              '- [ ] executar smoke visual/interativo do WPF em Windows real, incluindo o fluxo de Solicitação de Compra;',
              '- [ ] executar smoke visual/interativo do WPF em Windows real, incluindo Solicitação de Compra, RFQ e Comparação de Cotações;')
          replace_required(backlog,
              '- [ ] especificar o terceiro slice de Compras antes de implementar comparação/seleção, aprovação ou Pedido de Compra;',
              '- [x] especificar o terceiro slice de Comparação de Cotações em `docs/QUOTATION-COMPARISON-SPEC.md`;\n- [x] implementar read model autorizado e determinístico de comparação sem nova persistência;\n- [x] integrar janela WPF somente leitura de comparação ao RFQ;\n- [ ] especificar o quarto slice de decisão/adjudicação e sua relação com Pedido de Compra antes de persistir vencedor ou gerar pedido;')
          replace_required(backlog,
              'Baseline automatizado atual: **235/235 testes** (Domain 63, Application 115, Persistence 51, Infrastructure 6), **15 migrations**, build Release e benchmark tool com 0 warnings/erros, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validado pelo CI #160.',
              'Baseline automatizado atual: **238/238 testes** (Domain 63, Application 118, Persistence 51, Infrastructure 6), **15 migrations**, build Release e benchmark tool com 0 warnings/erros, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validado pelo CI #166.')
          replace_required(backlog,
              'A próxima prioridade funcional é **especificar o terceiro slice de Compras antes de qualquer nova implementação**. Comparação/seleção, aprovação e Pedido de Compra permanecem fora do código até haver regras explícitas. Smoke WPF e benchmark em hardware representativo permanecem pendências de pré-release.',
              'O terceiro slice de **Comparação de Cotações** está implementado como leitura: fornecedores convidados, status/moeda das respostas e ofertas finalizadas por linha são exibidos sem ranking, conversão cambial ou seleção automática.\n\nA próxima prioridade funcional é **especificar o quarto slice de Compras antes de qualquer nova implementação**, definindo decisão/adjudicação e a relação com Pedido de Compra. Aprovação e geração de Pedido de Compra permanecem fora do código até haver regras explícitas. Smoke WPF e benchmark em hardware representativo permanecem pendências de pré-release.')

          testing = 'local-erp/docs/TESTING.md'
          replace_required(testing, '- Application: 115/115;', '- Application: 118/118;')
          replace_required(testing, '- Total automatizado: 235/235;', '- Total automatizado: 238/238;')
          replace_required(testing,
              '- CI #160 validou 235/235 testes e 15 migrations, além da compilação completa da workspace WPF de RFQ.\nA compilação WPF valida XAML, handlers, composição de tipos e DI compilável, mas não substitui smoke visual/interativo em Windows real.',
              '- CI #160 validou o slice vertical de RFQ com 235/235 testes e 15 migrations;\n- comparação de cotações: projeção autorizada, fornecedores sem resposta preservados, preços de `Draft` ignorados, moedas não convertidas e matriz por linha;\n- CI #166 validou a janela WPF `QuotationComparisonWindow`, **238/238 testes** e as mesmas 15 migrations sem mudança de modelo.\nA compilação WPF valida XAML, handlers, composição de tipos e DI compilável, mas não substitui smoke visual/interativo em Windows real.')
          replace_required(testing,
              '- Cotação/RFQ: criação a partir de Solicitação `Submitted`, linhas, fornecedores, envio, respostas, preços/datas, finalização, encerramento/cancelamento e permissões insuficientes;',
              '- Cotação/RFQ: criação a partir de Solicitação `Submitted`, linhas, fornecedores, envio, respostas, preços/datas, finalização, encerramento/cancelamento e permissões insuficientes;\n- Comparação de Cotações: abertura a partir do RFQ, fornecedores sem resposta, resposta `Draft` sem preço comparável, moedas distintas, linhas sem oferta e rolagem horizontal;')

          changelog = 'local-erp/CHANGELOG.md'
          replace_required(changelog,
              '- workspace WPF de RFQ integrado ao módulo Compras.',
              '- workspace WPF de RFQ integrado ao módulo Compras;\n- terceiro slice de Comparação de Cotações com projeção Application somente leitura;\n- janela WPF `QuotationComparisonWindow` integrada ao RFQ, exibindo fornecedores, estado/moeda e ofertas finalizadas por linha sem ranking ou adjudicação.')
          replace_required(changelog, '- suíte automatizada: 235/235;', '- suíte automatizada: 238/238;')
          replace_required(changelog,
              '- Domain 63/63, Application 115/115, Persistence 51/51, Infrastructure 6/6;',
              '- Domain 63/63, Application 118/118, Persistence 51/51, Infrastructure 6/6;')
          replace_required(changelog,
              '- CI #160 validou o slice vertical de RFQ com 235/235 testes, snapshot EF consistente e 15 migrations em apply -> rollback 0 -> reapply;',
              '- CI #160 validou o slice vertical de RFQ com 235/235 testes, snapshot EF consistente e 15 migrations em apply -> rollback 0 -> reapply;\n- CI #166 validou Comparação de Cotações, compilação WPF, 238/238 testes, snapshot EF limpo e as mesmas 15 migrations;')
          PY

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-quotation-comparison-docs.yml
          git add local-erp/README.md local-erp/docs/ROADMAP.md local-erp/docs/QUOTATION-COMPARISON-SPEC.md local-erp/docs/TESTING.md local-erp/tasks/BACKLOG.md local-erp/CHANGELOG.md
          git commit -m "docs(purchases): close quotation comparison slice"
          git push origin HEAD:erp-local-ci
