name: Fix RFQ award analyzer

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/fix-rfq-award-analyzer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-local-ci
          fetch-depth: 0

      - name: Apply CA1859 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('local-erp/src/LocalErp.Desktop/RequestForQuotationAwardWindow.xaml.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'IReadOnlyDictionary<Guid, RequestForQuotationComparisonSupplierResult> supplierById': 'Dictionary<Guid, RequestForQuotationComparisonSupplierResult> supplierById',
              'IReadOnlyDictionary<Guid, Guid> selections': 'Dictionary<Guid, Guid> selections',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected analyzer target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-rfq-award-analyzer.yml
          git add local-erp/src/LocalErp.Desktop/RequestForQuotationAwardWindow.xaml.cs
          git commit -m "fix(purchases): satisfy RFQ award analyzer"
          git push origin HEAD:erp-local-ci
