name: ERP Record Coverage Milestone

on:
  push:
    branches:
      - erp-coverage-baseline
    paths:
      - '.github/workflows/erp-record-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-coverage-baseline
          fetch-depth: 0

      - name: Record coverage baseline and clean technical trigger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = Get-Content $Path -Raw
            if (-not $text.Contains($Old)) {
              throw "Expected anchor not found in $Path: $Old"
            }
            $text = $text.Replace($Old, $New)
            Set-Content $Path $text -Encoding utf8NoBOM -NoNewline
          }

          Replace-Exact 'local-erp/tasks/BACKLOG.md' '- [ ] coverage quando a suíte tiver volume suficiente;' '- [x] coverage automatizado com baseline Cobertura/JSON e validação de coleta, sem threshold percentual arbitrário;'
          Replace-Exact 'local-erp/tasks/BACKLOG.md' 'A auditoria NuGet falha diante de qualquer advisory direto ou transitivo conhecido e possui teste sintético do próprio caminho de rejeição.' 'A auditoria NuGet falha diante de qualquer advisory direto ou transitivo conhecido e possui teste sintético do próprio caminho de rejeição. O coverage automatizado gera Cobertura + JSON e registrou baseline de 96,76% de linhas (7.578/7.832) nos quatro assemblies de produção exercitados pela suíte; branch coverage não é reportado porque o Cobertura gerado não contém dados reais de branches.'
          Replace-Exact 'local-erp/tasks/BACKLOG.md' 'Entre as pendências de engenharia que não exigem nova regra de negócio, a próxima prioridade provável é estabelecer **coverage automatizado com baseline útil**, sem transformar percentual isolado em meta artificial.' 'Entre as pendências de engenharia que não exigem nova regra de negócio, a próxima prioridade provável é melhorar **atalhos, foco e navegação por teclado do shell**, preservando o smoke automatizado e sem iniciar novo slice funcional.'

          Replace-Exact 'local-erp/docs/TESTING.md' 'Executa restore, auditoria NuGet direta/transitiva com gate de rejeição sintética, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, smoke WPF, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply.' 'Executa restore, auditoria NuGet direta/transitiva com gate de rejeição sintética, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, coleta de coverage, smoke WPF, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply.'
          Replace-Exact 'local-erp/docs/TESTING.md' '- NuGet audit: nenhuma vulnerabilidade conhecida em dependências diretas ou transitivas; fixture sintética vulnerável rejeitada pelo gate;' '- NuGet audit: nenhuma vulnerabilidade conhecida em dependências diretas ou transitivas; fixture sintética vulnerável rejeitada pelo gate;`n- Coverage de linhas: 96,76% (7.578/7.832) nos assemblies Domain/Application/Infrastructure/Persistence; branch coverage indisponível no Cobertura gerado; sem threshold percentual arbitrário;'
          $testingAnchor = '### Auditoria NuGet automatizada'
          $testingText = Get-Content 'local-erp/docs/TESTING.md' -Raw
          if (-not $testingText.Contains($testingAnchor)) { throw 'TESTING coverage insertion anchor missing.' }
          $coverageSection = @'
### Coverage automatizado

`scripts/coverage.ps1` usa o coletor Microsoft `Code Coverage` do VSTest e a ferramenta local `dotnet-coverage` 18.12.0. A suíte é executada com `coverage.runsettings`; os arquivos `.coverage` são mesclados em `artifacts/coverage/coverage.cobertura.xml` e um resumo estruturado é gravado em `coverage-summary.json`. O CI publica ambos no artifact `localerp-code-coverage`.

O baseline técnico validado no CI #210 cobre os quatro assemblies de produção carregados pelos testes: **96,76% de linhas no total (7.578/7.832)**, com Application **96,34%**, Domain **88,18%**, Infrastructure **57,50%** e Persistence **98,91%**. `LocalErp.Desktop` não aparece nesse relatório porque o smoke WPF é um processo/UI Automation separado da execução instrumentada dos testes; o executável continua coberto pelos dois smokes automatizados e pelo gate visual manual de pré-release.

O Cobertura produzido pela ferramenta Microsoft nesta configuração não contém linhas marcadas como branches nem contadores reais de branches. Por isso o resumo registra `branchDataAvailable=false` e **não interpreta o `branch-rate` padrão como 100%**. Não existe threshold percentual obrigatório: o gate falha se a coleta estiver ausente, inválida ou sem linhas válidas, enquanto os percentuais servem como baseline observável para orientar testes por risco e comportamento.

'@
          $testingText = $testingText.Replace($testingAnchor, $coverageSection + $testingAnchor)
          Set-Content 'local-erp/docs/TESTING.md' $testingText -Encoding utf8NoBOM -NoNewline

          Replace-Exact 'local-erp/README.md' '- CI Windows: build Release com 0 warnings / 0 errors, 271/271 testes, auditoria NuGet direta/transitiva, smoke WPF e smoke do pacote publicado passando' '- CI Windows: build Release com 0 warnings / 0 errors, 271/271 testes, auditoria NuGet direta/transitiva, coverage de linhas 96,76%, smoke WPF e smoke do pacote publicado passando'
          Replace-Exact 'local-erp/README.md' 'Benchmark de senha em hardware representativo e verificação automatizada de dependências vulneráveis permanecem pendências próprias.' 'Benchmark de senha em hardware representativo permanece pendência de pré-release; auditoria NuGet e coverage automatizado já integram o CI.'
          Replace-Exact 'local-erp/README.md' './scripts/check-vulnerable-packages.ps1`n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64' './scripts/check-vulnerable-packages.ps1`n./scripts/coverage.ps1 -Configuration Release`n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64'

          Replace-Exact 'local-erp/CHANGELOG.md' '- auditoria automatizada de vulnerabilidades NuGet diretas/transitivas, com parser JSON e teste sintético de rejeição no CI;' '- auditoria automatizada de vulnerabilidades NuGet diretas/transitivas, com parser JSON e teste sintético de rejeição no CI;`n- coverage automatizado com coletor Microsoft, `dotnet-coverage`, relatório Cobertura/JSON e artifact dedicado, sem threshold percentual arbitrário;'
          Replace-Exact 'local-erp/CHANGELOG.md' '- CI técnico #207 validou zero vulnerabilidades NuGet conhecidas, rejeição de uma fixture vulnerável, 271/271 testes e todos os gates de WPF, EF/migrations e package;' '- CI técnico #207 validou zero vulnerabilidades NuGet conhecidas, rejeição de uma fixture vulnerável, 271/271 testes e todos os gates de WPF, EF/migrations e package;`n- CI técnico #210 validou coverage de linhas em 96,76% (7.578/7.832), branch coverage corretamente marcado como indisponível, 271/271 testes e todos os gates anteriores;'

          $roadmap = Get-Content 'local-erp/docs/ROADMAP.md' -Raw
          if ($roadmap.Contains('## Marco do coverage automatizado — 2026-10-23')) { throw 'Coverage milestone already exists unexpectedly.' }
          $roadmap += @'


## Marco do coverage automatizado — 2026-10-23

O projeto passou a coletar cobertura de código por `scripts/coverage.ps1`, usando o coletor Microsoft `Code Coverage` e `dotnet-coverage` 18.12.0 para gerar Cobertura e JSON reproduzíveis. O CI publica `localerp-code-coverage` e falha quando a coleta é ausente, inválida ou não contém linhas válidas, mas não impõe meta percentual arbitrária.

O CI técnico #210 validou **96,76% de cobertura de linhas (7.578/7.832)** nos quatro assemblies exercitados pelos testes: Application 96,34%, Domain 88,18%, Infrastructure 57,50% e Persistence 98,91%. O relatório Cobertura dessa configuração não traz dados reais de branches, então branch coverage é registrado como indisponível em vez de interpretar o valor padrão como 100%. O Desktop WPF continua validado pelos smokes automatizados e pelo smoke visual/interativo manual de pré-release.
'@
          Set-Content 'local-erp/docs/ROADMAP.md' $roadmap -Encoding utf8NoBOM -NoNewline

          Replace-Exact 'local-erp/tasks/TECH-DEBT.md' '- O benchmark de password hashing ainda deve ser repetido em hardware Windows representativo.' '- O benchmark de password hashing ainda deve ser repetido em hardware Windows representativo.`n- O baseline de coverage automatizado mede Domain/Application/Infrastructure/Persistence, mas não instrumenta o processo Desktop WPF executado pelo smoke. A UI continua dependente dos smokes automatizados e da validação visual/interativa manual; branch coverage também não está disponível no Cobertura gerado pela ferramenta atual e não deve ser inferido como 100%.'

          Replace-Exact 'local-erp/tasks/BUGS.md' 'auditoria NuGet sem vulnerabilidades conhecidas diretas/transitivas e validação do pacote portátil Windows self-contained com migration bundle.' 'auditoria NuGet sem vulnerabilidades conhecidas diretas/transitivas, coverage de linhas em 96,76% com relatório Cobertura/JSON válido e validação do pacote portátil Windows self-contained com migration bundle.'

          $ci = Get-Content '.github/workflows/erp-ci.yml' -Raw
          $ci = $ci -replace "(?m)^      - erp-coverage-baseline\r?\n", ''
          if ($ci -match 'erp-coverage-baseline') { throw 'Temporary coverage branch trigger still exists in permanent CI.' }
          Set-Content '.github/workflows/erp-ci.yml' $ci -Encoding utf8NoBOM -NoNewline

          git rm '.github/workflows/erp-record-coverage.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.github/workflows/erp-ci.yml' local-erp/README.md local-erp/CHANGELOG.md local-erp/docs/TESTING.md local-erp/docs/ROADMAP.md local-erp/tasks/BACKLOG.md local-erp/tasks/BUGS.md local-erp/tasks/TECH-DEBT.md
          git commit -m 'docs(test): record coverage baseline'
          git push origin HEAD:erp-coverage-baseline
