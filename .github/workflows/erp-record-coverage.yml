name: ERP Record Coverage Milestone

on:
  push:
    branches:
      - erp-coverage-baseline
    paths:
      - '.github/workflows/erp-record-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-coverage-baseline
          fetch-depth: 0
      - name: Normalize README line endings
        shell: pwsh
        run: |
          $path = 'local-erp/README.md'
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
      - name: Record coverage baseline
        shell: pwsh
        run: ./.github/scripts/record-coverage-milestone.ps1
