name: ERP Purchase Order WPF Validation

on:
  push:
    branches:
      - erp-purchase-order-wpf
    paths:
      - 'local-erp/**'
      - '.github/workflows/erp-purchase-order-wpf-ci.yml'

permissions:
  contents: write

concurrency:
  group: erp-purchase-order-wpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: local-erp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF tool
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore LocalErp.sln

      - name: Build Release
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Build password hash benchmark tool
        run: dotnet build tools/LocalErp.PasswordHashBenchmark/LocalErp.PasswordHashBenchmark.csproj --configuration Release

      - name: Run tests
        run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Verify migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reset disposable database
        shell: pwsh
        working-directory: .
        run: Remove-Item (Join-Path $env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Apply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Roll back to zero
        run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reapply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: purchase-order-wpf-test-results
          path: local-erp/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary validation workflow after success
        if: success()
        shell: bash
        working-directory: .
        run: |
          git rm .github/workflows/erp-purchase-order-wpf-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(purchases): remove temporary WPF validation"
          git push origin HEAD:erp-purchase-order-wpf
