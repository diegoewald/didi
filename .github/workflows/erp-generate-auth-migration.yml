name: Generate authentication throttling migration

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/erp-generate-auth-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: local-erp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF tool
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore LocalErp.sln

      - name: Generate migration
        run: dotnet ef migrations add AddAuthenticationThrottling --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Show generated files
        shell: pwsh
        run: Get-ChildItem src/LocalErp.Persistence/Migrations | Sort-Object Name | Select-Object Name, Length

      - name: Upload generated migration
        uses: actions/upload-artifact@v7
        with:
          name: authentication-throttling-migration
          path: |
            local-erp/src/LocalErp.Persistence/Migrations/*AddAuthenticationThrottling*.cs
            local-erp/src/LocalErp.Persistence/Migrations/ErpDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1
