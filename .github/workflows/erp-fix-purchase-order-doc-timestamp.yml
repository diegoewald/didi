name: ERP Fix Purchase Order Documentation Timestamp

on:
  push:
    branches:
      - erp-purchase-order-persistence
    paths:
      - '.github/workflows/erp-fix-purchase-order-doc-timestamp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Align migration timestamp and remove temporary workflow
        shell: pwsh
        run: |
          foreach ($path in @('local-erp/tasks/BACKLOG.md', 'local-erp/docs/ROADMAP.md')) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains('20261022153544_AddPurchaseOrders')) { throw "Old migration timestamp not found in ${path}" }
            $text = $text.Replace('20261022153544_AddPurchaseOrders', '20261022154117_AddPurchaseOrders')
            Set-Content $path -Value $text -NoNewline -Encoding utf8
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/erp-fix-purchase-order-doc-timestamp.yml
          git add local-erp/tasks/BACKLOG.md local-erp/docs/ROADMAP.md
          git commit -m "docs(purchases): align purchase order migration timestamp"
          git push origin HEAD:erp-purchase-order-persistence
