name: Add RFQ award button

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/add-rfq-award-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: erp-local-ci
          fetch-depth: 0

      - name: Add award action to RFQ workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('local-erp/src/LocalErp.Desktop/Views/RequestForQuotationsWorkspaceView.xaml')
          lines = path.read_text(encoding='utf-8').splitlines()
          if any('Click="OpenAward_Click"' in line for line in lines):
              raise SystemExit('Award action already exists')

          start = next((i for i, line in enumerate(lines) if 'Click="OpenComparison_Click"' in line), None)
          if start is None:
              raise SystemExit('Comparison action not found')

          close = next((i for i in range(start, min(start + 5, len(lines))) if '/>' in lines[i]), None)
          if close is None:
              raise SystemExit('Comparison action closing line not found')

          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          continuation = indent + '        '
          award = [
              indent + '<Button Content="Adjudicação" Click="OpenAward_Click" Padding="12,7" MinWidth="105" Margin="0,0,8,0" Cursor="Hand"',
              continuation + 'Background="{StaticResource Brush.Surface}" BorderBrush="{StaticResource Brush.Border}" BorderThickness="1"',
              continuation + 'Visibility="{Binding IsClosed, Converter={StaticResource BoolToVisibilityConverter}}" />',
          ]
          lines[close + 1:close + 1] = award
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-rfq-award-button.yml
          git add local-erp/src/LocalErp.Desktop/Views/RequestForQuotationsWorkspaceView.xaml
          git commit -m "feat(purchases): expose RFQ award action"
          git push origin HEAD:erp-local-ci
