name: ERP Integrate Purchase Order WPF

on:
  push:
    branches:
      - erp-purchase-order-wpf
    paths:
      - '.github/workflows/erp-integrate-purchase-order-wpf.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Integrate workspace into DI and shell
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          app = 'local-erp/src/LocalErp.Desktop/App.xaml.cs'
          replace_exact(
              app,
              '                services.AddTransient<PurchaseOrderService>();\n                services.AddTransient<PurchaseRequestService>();',
              '                services.AddTransient<PurchaseOrderService>();\n                services.AddTransient<PurchaseOrderCreationLookupService>();\n                services.AddTransient<PurchaseRequestService>();')
          replace_exact(
              app,
              '                services.AddTransient<PurchaseRequestsWorkspaceViewModel>();\n                services.AddTransient<RequestForQuotationsWorkspaceViewModel>();',
              '                services.AddTransient<PurchaseRequestsWorkspaceViewModel>();\n                services.AddTransient<RequestForQuotationsWorkspaceViewModel>();\n                services.AddTransient<PurchaseOrdersWorkspaceViewModel>();')

          vm = 'local-erp/src/LocalErp.Desktop/ViewModels/MainWindowViewModel.cs'
          replace_exact(
              vm,
              '        PurchaseRequestsWorkspaceViewModel purchaseRequestsWorkspace,\n        RequestForQuotationsWorkspaceViewModel requestForQuotationsWorkspace)',
              '        PurchaseRequestsWorkspaceViewModel purchaseRequestsWorkspace,\n        RequestForQuotationsWorkspaceViewModel requestForQuotationsWorkspace,\n        PurchaseOrdersWorkspaceViewModel purchaseOrdersWorkspace)')
          replace_exact(
              vm,
              '        RequestForQuotationsWorkspace = requestForQuotationsWorkspace ?? throw new ArgumentNullException(nameof(requestForQuotationsWorkspace));',
              '        RequestForQuotationsWorkspace = requestForQuotationsWorkspace ?? throw new ArgumentNullException(nameof(requestForQuotationsWorkspace));\n        PurchaseOrdersWorkspace = purchaseOrdersWorkspace ?? throw new ArgumentNullException(nameof(purchaseOrdersWorkspace));')
          replace_exact(
              vm,
              '    public RequestForQuotationsWorkspaceViewModel RequestForQuotationsWorkspace { get; }',
              '    public RequestForQuotationsWorkspaceViewModel RequestForQuotationsWorkspace { get; }\n    public PurchaseOrdersWorkspaceViewModel PurchaseOrdersWorkspace { get; }')

          xaml = 'local-erp/src/LocalErp.Desktop/MainWindow.xaml'
          replace_exact(
              xaml,
              '          <TabItem Header="Cotações">\n            <views:RequestForQuotationsWorkspaceView x:Name="RequestForQuotationsWorkspacePanel" DataContext="{Binding RequestForQuotationsWorkspace}" />\n          </TabItem>',
              '          <TabItem Header="Cotações">\n            <views:RequestForQuotationsWorkspaceView x:Name="RequestForQuotationsWorkspacePanel" DataContext="{Binding RequestForQuotationsWorkspace}" />\n          </TabItem>\n          <TabItem Header="Pedidos">\n            <views:PurchaseOrdersWorkspaceView DataContext="{Binding PurchaseOrdersWorkspace}" />\n          </TabItem>')

          code = 'local-erp/src/LocalErp.Desktop/MainWindow.xaml.cs'
          replace_exact(
              code,
              '        else if (PurchasingTabControl.SelectedIndex == 1 && !viewModel.RequestForQuotationsWorkspace.HasLoaded)\n            await viewModel.RequestForQuotationsWorkspace.LoadAsync();',
              '        else if (PurchasingTabControl.SelectedIndex == 1 && !viewModel.RequestForQuotationsWorkspace.HasLoaded)\n            await viewModel.RequestForQuotationsWorkspace.LoadAsync();\n        else if (PurchasingTabControl.SelectedIndex == 2 && !viewModel.PurchaseOrdersWorkspace.HasLoaded)\n            await viewModel.PurchaseOrdersWorkspace.LoadAsync();')

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/erp-integrate-purchase-order-wpf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/src/LocalErp.Desktop/App.xaml.cs \
                  local-erp/src/LocalErp.Desktop/MainWindow.xaml \
                  local-erp/src/LocalErp.Desktop/MainWindow.xaml.cs \
                  local-erp/src/LocalErp.Desktop/ViewModels/MainWindowViewModel.cs
          git commit -m "feat(purchases): integrate purchase order workspace"
          git push origin HEAD:erp-purchase-order-wpf
