name: CAES Motion V3 Preview

on:
  push:
    branches: ["nexo-mk4-caes-stage"]
    paths:
      - "nexo/produce_caes_motion_v3.py"
      - "nexo/caes_audio_cues_v3.json"
      - ".github/workflows/caes-motion-v3-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5 compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nexo/produce_caes_motion_v3.py')
          s=p.read_text()
          s=s.replace("    if action:\n        for fc in action.fcurves:", "    if action and hasattr(action, 'fcurves'):\n        for fc in action.fcurves:")
          p.write_text(s)
          PY
      - name: Install Blender dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils curl xvfb libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libxext6 libxxf86vm1 libgl1 libegl1 libgl1-mesa-dri
      - name: Download Blender 5.2.2 LTS
        run: |
          curl -L --retry 4 -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar -xf blender.tar.xz
      - name: Render 13 vertical shot previews
        env:
          CAES_PREVIEW: "1"
        run: |
          xvfb-run -a ./blender-5.2.2-linux-x64/blender --background --factory-startup --python-exit-code 1 --python nexo/produce_caes_motion_v3.py
      - name: Verify previews
        run: |
          test -s output_caes_motion_v3/CAES_MOTION_V3_MASTER.blend
          test "$(find output_caes_motion_v3 -name 'preview_*.jpg' | wc -l)" -ge 13
          ls -lh output_caes_motion_v3/
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: CAES_MOTION_V3_PREVIEW
          path: output_caes_motion_v3/
          if-no-files-found: error
          retention-days: 30
