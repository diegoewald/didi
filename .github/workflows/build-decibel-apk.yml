name: Build Decibel Meter Pro APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-decibel-apk.yml'
      - 'decibel-apk/v21patch.part*'
      - 'decibel-apk/v22.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android Studio project
        run: |
          cat decibel-apk/v2project.b64.part* | base64 --decode > /tmp/DecibelMeterPro_AndroidStudio_v2.zip
          rm -rf /tmp/decibel-build
          mkdir -p /tmp/decibel-build
          unzip -q /tmp/DecibelMeterPro_AndroidStudio_v2.zip -d /tmp/decibel-build
          test -f /tmp/decibel-build/DecibelMeterPro/settings.gradle

      - name: Apply battery optimization patch
        run: |
          echo "4596b0960f61d4daf47d8a98ed712c5448c45050bb03891e3f839f24384af4be  decibel-apk/v21patch.part00" | sha256sum -c -
          echo "e11758fc777b54872e541f6507d5d955a76b9da642a476a74e427bef40e563d6  decibel-apk/v21patch.part01" | sha256sum -c -
          echo "7459a9a377b5d5117cf85a4a0cab321c25989d06cbfd6c36d3d4f4fa324121ae  decibel-apk/v21patch.part02" | sha256sum -c -
          echo "30e635c263cd1d51d3c79946270f631bde4f3d006e845558314bab954ccce555  decibel-apk/v21patch.part03" | sha256sum -c -
          echo "e8fe7aaf2f582f82f9ce5c08bacaaee898d38f74d1711d8794c0d3b80de43259  decibel-apk/v21patch.part04" | sha256sum -c -
          echo "abc4e2fd78773884339268969eb406475b74b3f249a4be6c543c50bd706b22b5  decibel-apk/v21patch.part05" | sha256sum -c -
          echo "6b87a4b3d4e52cb235fea72fc4b47b46fa01855abfa650625dfedd2959d70d3f  decibel-apk/v21patch.part06" | sha256sum -c -
          cat decibel-apk/v21patch.part* > /tmp/v21patch.b64
          echo "1e118484738bf46a5e055839279cd66bde973f1fa5fe622db24ef851b2b77023  /tmp/v21patch.b64" | sha256sum -c -
          base64 --decode /tmp/v21patch.b64 | gzip -dc > /tmp/decibel-v21.patch
          echo "8d8119ab623e9e92591a00ad3fd8a75ab273ee18685ef7bfbd91033e159b3112  /tmp/decibel-v21.patch" | sha256sum -c -
          cd /tmp/decibel-build/DecibelMeterPro
          patch -p2 < /tmp/decibel-v21.patch
          grep -q "versionName '2.1.0'" app/build.gradle

      - name: Apply theme and smooth needle patch
        run: |
          echo "a26d903a008fffb2db506120ae315fb7b69fde40de53a5d47c0801cb04769c49  decibel-apk/v22.patch.gz.b64" | sha256sum -c -
          base64 --decode decibel-apk/v22.patch.gz.b64 | gzip -dc > /tmp/decibel-v22.patch
          echo "edf702fc31ed00e52ba9755c67c620f3e8a9312ecf47808486110515ad01edb3  /tmp/decibel-v22.patch" | sha256sum -c -
          cd /tmp/decibel-build/DecibelMeterPro
          patch -p2 < /tmp/decibel-v22.patch
          grep -q "versionName '2.2.0'" app/build.gradle

      - name: Build installable debug APK
        working-directory: /tmp/decibel-build/DecibelMeterPro
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare installer
        run: |
          mkdir -p /tmp/installer
          cp /tmp/decibel-build/DecibelMeterPro/app/build/outputs/apk/debug/app-debug.apk /tmp/installer/Decibel_Meter_Pro_v2.2.apk
          sha256sum /tmp/installer/Decibel_Meter_Pro_v2.2.apk

      - name: Upload APK installer
        uses: actions/upload-artifact@v4
        with:
          name: Decibel-Meter-Pro-v2.2-APK
          path: /tmp/installer/Decibel_Meter_Pro_v2.2.apk
          if-no-files-found: error
          retention-days: 30
