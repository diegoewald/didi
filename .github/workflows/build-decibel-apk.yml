name: Build Decibel Meter Pro APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-decibel-apk.yml'
      - 'decibel-apk/v21patch.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android Studio project
        run: |
          cat decibel-apk/v2project.b64.part* | base64 --decode > /tmp/DecibelMeterPro_AndroidStudio_v2.zip
          rm -rf /tmp/decibel-build
          mkdir -p /tmp/decibel-build
          unzip -q /tmp/DecibelMeterPro_AndroidStudio_v2.zip -d /tmp/decibel-build
          test -f /tmp/decibel-build/DecibelMeterPro/settings.gradle

      - name: Apply battery optimization patch
        run: |
          cat decibel-apk/v21patch.part* > /tmp/v21patch.b64
          test "$(wc -c < /tmp/v21patch.b64)" -eq 12056
          echo "1e118484738bf46a5e055839279cd66bde973f1fa5fe622db24ef851b2b77023  /tmp/v21patch.b64" | sha256sum -c -
          base64 --decode /tmp/v21patch.b64 | gzip -dc > /tmp/decibel-v21.patch
          echo "8d8119ab623e9e92591a00ad3fd8a75ab273ee18685ef7bfbd91033e159b3112  /tmp/decibel-v21.patch" | sha256sum -c -
          cd /tmp/decibel-build/DecibelMeterPro
          patch -p2 < /tmp/decibel-v21.patch
          grep -q "versionName '2.1.0'" app/build.gradle

      - name: Build installable debug APK
        working-directory: /tmp/decibel-build/DecibelMeterPro
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare installer
        run: |
          mkdir -p /tmp/installer
          cp /tmp/decibel-build/DecibelMeterPro/app/build/outputs/apk/debug/app-debug.apk /tmp/installer/Decibel_Meter_Pro_v2.1_ECO.apk
          sha256sum /tmp/installer/Decibel_Meter_Pro_v2.1_ECO.apk

      - name: Upload APK installer
        uses: actions/upload-artifact@v4
        with:
          name: Decibel-Meter-Pro-v2.1-ECO-APK
          path: /tmp/installer/Decibel_Meter_Pro_v2.1_ECO.apk
          if-no-files-found: error
          retention-days: 30
