name: Build Decibel Meter APK

on:
  push:
    branches:
      - build/decibel-meter-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          rm -rf /tmp/decibel-build
          mkdir -p /tmp/decibel-build
          unzip -q decibel-meter/DecibelMeterPro_AndroidStudio.zip -d /tmp/decibel-build
          chmod +x /tmp/decibel-build/DecibelMeterPro/gradlew

      - name: Build debug APK
        working-directory: /tmp/decibel-build/DecibelMeterPro
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p /tmp/installer
          cp /tmp/decibel-build/DecibelMeterPro/app/build/outputs/apk/debug/app-debug.apk /tmp/installer/Medidor_de_Decibeis_v1.0.apk

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Medidor-de-Decibeis-APK
          path: /tmp/installer/Medidor_de_Decibeis_v1.0.apk
          if-no-files-found: error
