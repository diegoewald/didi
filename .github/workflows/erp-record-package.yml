name: ERP Record Package Milestone

on:
  push:
    branches:
      - erp-package-release
    paths:
      - '.github/workflows/erp-record-package.yml'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update package milestone documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          backlog = 'local-erp/tasks/BACKLOG.md'
          replace_exact(backlog, '- [ ] script de package/release;', '- [x] script de package/release para pacote portátil Windows de QA, self-contained, com migration bundle, hashes e smoke do binário publicado;')
          replace_exact(
              backlog,
              'Baseline automatizado atual: **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), **17 migrations**, build Release e benchmark tool com 0 warnings/erros, smoke WPF automatizado, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validados no CI Windows.',
              'Baseline automatizado atual: **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), **17 migrations**, build Release e benchmark tool com 0 warnings/erros, smoke WPF automatizado, snapshot EF sem mudanças pendentes e apply -> rollback 0 -> reapply validados no CI Windows. O CI também gera um pacote portátil `win-x64` self-contained com migration bundle, SHA-256, inicializador seguro de banco novo e smoke executado sobre o binário publicado.')
          replace_exact(
              backlog,
              'O benchmark em hardware representativo continua como pendência de pré-release.',
              'O benchmark em hardware representativo continua como pendência de pré-release. Entre as pendências de engenharia que não exigem nova regra de negócio, a próxima prioridade é a **verificação automatizada de dependências vulneráveis**.')

          debt = 'local-erp/tasks/TECH-DEBT.md'
          replace_exact(
              debt,
              '- Verificação automatizada de dependências vulneráveis e script de package/release permanecem pendências de engenharia.',
              '- A verificação automatizada de dependências vulneráveis permanece pendência de engenharia. O package/release portátil de QA já existe e é validado no CI, mas assinatura de código, Velopack e orquestração segura de upgrade de banco existente continuam fora dele e permanecem necessários para distribuição de produção.')

          testing = 'local-erp/docs/TESTING.md'
          replace_exact(
              testing,
              'O CI permanente usa Windows Server 2025, .NET SDK 10.0.402 e `dotnet-ef` 10.0.13. Executa restore, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply.',
              'O CI permanente usa Windows Server 2025, .NET SDK 10.0.402 e `dotnet-ef` 10.0.13. Executa restore, build Release, build de `LocalErp.PasswordHashBenchmark`, testes, smoke WPF, `has-pending-model-changes`, apply de migrations, rollback para zero e reapply. Depois gera o pacote portátil Windows self-contained, valida a inicialização de banco novo e executa novamente o smoke usando o executável e o migration bundle publicados.')
          replace_exact(
              testing,
              '- Migrations: 17; apply -> rollback 0 -> reapply passando.',
              '- Migrations: 17; apply -> rollback 0 -> reapply passando.\n- Package QA: `win-x64` self-contained + migration bundle + hashes; inicialização de banco novo e smoke do binário publicado passando.')
          p = Path(testing)
          text = p.read_text(encoding='utf-8')
          marker = '### Pacote Windows de QA automatizado'
          if marker not in text:
              section = ('### Pacote Windows de QA automatizado\n\n'
                         '`scripts/package-release.ps1` publica o WPF como `win-x64` self-contained, gera `LocalErp.DatabaseMigrator.exe` com `dotnet ef migrations bundle`, cria `release-info.json`, `SHA256SUMS.txt`, o ZIP e o SHA-256 externo. O CI valida `Initialize-FreshDatabase.ps1` em base descartável e exige que uma segunda execução recuse modificar banco já existente.\n\n'
                         'Em seguida, o mesmo `scripts/smoke-wpf.ps1` é executado contra `app/LocalErp.Desktop.exe` e contra o migration bundle que estão dentro do pacote. Assim, o gate cobre a distribuição real de QA em vez de validar somente `bin/Release`. Esse artefato continua sem assinatura e não substitui o futuro instalador Velopack nem o fluxo seguro de upgrade de banco existente. Detalhes: `docs/PACKAGING.md`.\n\n')
              insert_before = '### Cobertura de empresa/filial'
              if insert_before not in text:
                  raise RuntimeError('TESTING insertion marker not found')
              p.write_text(text.replace(insert_before, section + insert_before, 1), encoding='utf-8')

          roadmap = 'local-erp/docs/ROADMAP.md'
          p = Path(roadmap)
          text = p.read_text(encoding='utf-8')
          marker = '## Marco do pacote Windows portátil de QA — 2026-10-23'
          if marker not in text:
              section = ('\n\n## Marco do pacote Windows portátil de QA — 2026-10-23\n\n'
                         'O projeto passou a gerar `LocalErp-0.1.0-win-x64.zip` por `scripts/package-release.ps1`. O pacote contém o Desktop WPF publicado como self-contained, migration bundle da mesma release, inicializador restrito a banco novo, manifesto de release e hashes SHA-256.\n\n'
                         'O CI #204 validou o pacote de ponta a ponta: 271/271 testes, smoke WPF normal, snapshot EF limpo, 17 migrations em apply -> rollback 0 -> reapply, criação de banco novo pelo bundle, recusa explícita de banco existente e um segundo smoke WPF executando o binário publicado com o bundle publicado. Esse marco destrava o smoke manual em máquina Windows sem depender do SDK .NET, mas não conclui instalador, assinatura, atualização automática, backup ou recuperação segura de upgrade.')
              p.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          changelog = 'local-erp/CHANGELOG.md'
          replace_exact(
              changelog,
              '- smoke WPF automatizado no CI Windows com dados descartáveis, cobrindo bootstrap, autenticação, shell, abas básicas de Compras e logout;',
              '- smoke WPF automatizado no CI Windows com dados descartáveis, cobrindo bootstrap, autenticação, shell, abas básicas de Compras e logout;\n- pacote portátil Windows de QA com publicação `win-x64` self-contained, migration bundle, inicializador seguro de banco novo, metadados de release e hashes SHA-256;')
          replace_exact(
              changelog,
              '- CI técnico #199 validou o smoke WPF automatizado, 271/271 testes, snapshot EF limpo e 17 migrations em apply -> rollback 0 -> reapply;',
              '- CI técnico #199 validou o smoke WPF automatizado, 271/271 testes, snapshot EF limpo e 17 migrations em apply -> rollback 0 -> reapply;\n- CI técnico #204 validou geração do pacote portátil, inicialização de banco novo, recusa de banco existente e smoke WPF sobre o executável/migration bundle publicados;')

          bugs = 'local-erp/tasks/BUGS.md'
          replace_exact(
              bugs,
              'O ERP é validado pelo `ERP Permanent CI` em Windows Server 2025 com .NET 10. O baseline técnico atual concluiu com sucesso build Release, build da ferramenta de benchmark, **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), smoke WPF automatizado, verificação de snapshot EF e ciclo apply -> rollback 0 -> reapply das **17 migrations**.',
              'O ERP é validado pelo `ERP Permanent CI` em Windows Server 2025 com .NET 10. O baseline técnico atual concluiu com sucesso build Release, build da ferramenta de benchmark, **271/271 testes** (Domain 75, Application 130, Persistence 59, Infrastructure 7), smoke WPF automatizado, verificação de snapshot EF, ciclo apply -> rollback 0 -> reapply das **17 migrations** e validação do pacote portátil Windows self-contained com migration bundle.')

          readme = 'local-erp/README.md'
          replace_exact(
              readme,
              '- Fase: segurança/administração e cadastros-base fechados; Fase 7 de Compras em andamento com Solicitação, Cotação/RFQ, Comparação e Adjudicação manual operacionais',
              '- Fase: segurança/administração e cadastros-base fechados; Fase 7 de Compras com Solicitação, Cotação/RFQ, Comparação, Adjudicação manual e Pedido de Compra operacionais')
          replace_exact(
              readme,
              '- CI Windows: build Release com 0 warnings / 0 errors e 253/253 testes passando',
              '- CI Windows: build Release com 0 warnings / 0 errors, 271/271 testes, smoke WPF e smoke do pacote publicado passando')
          replace_exact(
              readme,
              '- Migrations: 16 migrations, snapshot consistente e ciclo apply -> rollback 0 -> reapply validado',
              '- Migrations: 17 migrations, snapshot consistente e ciclo apply -> rollback 0 -> reapply validado')
          replace_exact(
              readme,
              'O módulo Compras possui quatro slices verticais operacionais: **Solicitação de Compra**, **Cotação/RFQ**, **Comparação de Cotações** e **Adjudicação manual**. A adjudicação ocorre somente após o RFQ `Closed`, permite escolher manualmente no máximo uma oferta finalizada por linha inteira, deixa linhas sem seleção e permanece separada de Pedido de Compra. Não há ranking, recomendação automática, conversão cambial, split de quantidade ou criação automática de PO.\n\nA próxima frente funcional é **especificar Pedido de Compra antes de nova implementação**, definindo campos, estados, agrupamento das linhas adjudicadas, vínculo com fornecedor, preço/moeda, alteração/cancelamento e relação futura com recebimento. Aprovação e recebimento permanecem fora do código até suas regras serem documentadas. Consulta/retenção operacional da auditoria, smoke WPF em Windows real e benchmark de senha em hardware representativo continuam pendências próprias.',
              'O módulo Compras possui cinco slices verticais operacionais: **Solicitação de Compra**, **Cotação/RFQ**, **Comparação de Cotações**, **Adjudicação manual** e **Pedido de Compra**. O Pedido de Compra nasce somente de adjudicação `Finalized`, mantém um fornecedor por documento, snapshots imutáveis dos termos adjudicados, numeração interna crescente e estados `Draft/Issued/Cancelled`. Emissão é somente estado interno; não existe envio automático ao fornecedor.\n\nAprovação, recebimento, estoque, financeiro, fiscal e integrações externas continuam fora do código até que suas regras sejam especificadas. O próximo gate de produto é o smoke visual/interativo manual do fluxo completo em Windows real; o pacote portátil de QA já permite executar esse gate sem instalar o SDK .NET. Benchmark de senha em hardware representativo e verificação automatizada de dependências vulneráveis permanecem pendências próprias.')
          p = Path(readme)
          text = p.read_text(encoding='utf-8')
          marker = '## Pacote Windows de QA'
          if marker not in text:
              section = ('## Pacote Windows de QA\n\n'
                         'Para smoke manual em uma máquina Windows, gere um pacote portátil self-contained com o migration bundle da mesma release:\n\n'
                         '```powershell\n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64\n```\n\n'
                         'O pacote não é o instalador empresarial final: ele não possui assinatura, Velopack ou fluxo seguro de upgrade de base existente. Veja [Empacotamento](docs/PACKAGING.md).\n\n')
              insert_before = '## Objetivos de engenharia'
              if insert_before not in text:
                  raise RuntimeError('README insertion marker not found')
              text = text.replace(insert_before, section + insert_before, 1)
          text = text.replace(
              './scripts/benchmark-password-hashing.ps1\n```',
              './scripts/benchmark-password-hashing.ps1\n./scripts/package-release.ps1 -Configuration Release -Runtime win-x64\n```',
              1)
          text = text.replace(
              '- [Instalação](docs/INSTALLATION.md)\n',
              '- [Instalação](docs/INSTALLATION.md)\n- [Empacotamento](docs/PACKAGING.md)\n',
              1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/erp-record-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/README.md \
                  local-erp/CHANGELOG.md \
                  local-erp/docs/ROADMAP.md \
                  local-erp/docs/TESTING.md \
                  local-erp/tasks/BACKLOG.md \
                  local-erp/tasks/BUGS.md \
                  local-erp/tasks/TECH-DEBT.md
          git commit -m "docs(release): record portable package milestone"
          git push origin HEAD:erp-package-release
