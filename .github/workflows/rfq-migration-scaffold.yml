name: RFQ Migration Scaffold

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - 'local-erp/src/LocalErp.Persistence/**'
      - '.github/workflows/rfq-migration-scaffold.yml'

jobs:
  scaffold:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: local-erp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore EF tool
        run: dotnet tool restore
      - name: Restore persistence project
        run: dotnet restore src/LocalErp.Persistence/LocalErp.Persistence.csproj
      - name: Scaffold RFQ migration
        run: dotnet ef migrations add AddRequestForQuotations --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext
      - name: Upload generated migration
        uses: actions/upload-artifact@v7
        with:
          name: rfq-generated-migration
          path: |
            local-erp/src/LocalErp.Persistence/Migrations/*AddRequestForQuotations*
            local-erp/src/LocalErp.Persistence/Migrations/ErpDbContextModelSnapshot.cs
          if-no-files-found: error
