name: RFQ Migration Scaffold

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - 'local-erp/src/LocalErp.Persistence/**'
      - '.github/workflows/rfq-migration-scaffold.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: local-erp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore EF tool
        run: dotnet tool restore
      - name: Restore persistence project
        run: dotnet restore src/LocalErp.Persistence/LocalErp.Persistence.csproj
      - name: Scaffold RFQ migration
        run: dotnet ef migrations add AddRequestForQuotations --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext
      - name: Commit generated migration
        shell: pwsh
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-erp/src/LocalErp.Persistence/Migrations
          git commit -m "feat(purchases): add RFQ persistence migration"
          git push origin HEAD:erp-local-ci
