name: ERP Permanent CI

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - 'local-erp/**'
      - '.github/workflows/erp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-permanent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build test and validate database
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: local-erp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF and coverage tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore LocalErp.sln

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./scripts/check-vulnerable-packages.ps1 -NoRestore

      - name: Validate vulnerability gate behavior
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'localerp-synthetic-vulnerability.json'
          @'
          {
            "version": 1,
            "projects": [
              {
                "path": "Synthetic.csproj",
                "frameworks": [
                  {
                    "framework": "net10.0",
                    "topLevelPackages": [
                      {
                        "id": "Synthetic.Vulnerable",
                        "resolvedVersion": "1.0.0",
                        "vulnerabilities": [
                          {
                            "severity": "high",
                            "advisoryurl": "https://example.invalid/advisory"
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          }
          '@ | Set-Content $reportPath -Encoding utf8

          $blocked = $false
          try {
            ./scripts/check-vulnerable-packages.ps1 -ReportPath $reportPath
          }
          catch {
            $blocked = $true
            Write-Host "Expected synthetic vulnerability rejection: $($_.Exception.Message)"
          }
          finally {
            Remove-Item $reportPath -Force -ErrorAction SilentlyContinue
          }

          if (-not $blocked) {
            throw 'The vulnerability gate accepted a synthetic vulnerable package.'
          }

      - name: Build Release
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Build password hash benchmark tool
        run: dotnet build tools/LocalErp.PasswordHashBenchmark/LocalErp.PasswordHashBenchmark.csproj --configuration Release

      - name: Run tests
        run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Collect code coverage baseline
        shell: pwsh
        run: ./scripts/coverage.ps1 -Configuration Release -NoBuild -NoRestore -NoToolRestore

      - name: Run WPF smoke
        shell: pwsh
        run: ./scripts/smoke-wpf.ps1 -Configuration Release

      - name: Verify migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reset disposable database
        shell: pwsh
        working-directory: .\
        run: Remove-Item (Join-Path $env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Apply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Roll back to zero
        run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reapply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Build Windows portable QA package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'localerp-release')

      - name: Validate fresh database initializer
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'localerp-release'
          $package = Get-ChildItem $releaseRoot -Directory -Filter 'LocalErp-*-win-x64' | Select-Object -First 1
          if ($null -eq $package) { throw 'Packaged release directory was not found.' }
          $initializer = Join-Path $package.FullName 'database\Initialize-FreshDatabase.ps1'
          $testRoot = Join-Path $env:RUNNER_TEMP 'LocalErpFreshInit'
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          & $initializer -DataRoot $testRoot
          if (-not (Test-Path (Join-Path $testRoot 'Data\localerp.db') -PathType Leaf)) {
            throw 'Fresh database initializer did not create localerp.db.'
          }
          $refusedExisting = $false
          try {
            & $initializer -DataRoot $testRoot
          }
          catch {
            $refusedExisting = $true
            Write-Host "Expected existing-database refusal: $($_.Exception.Message)"
          }
          if (-not $refusedExisting) { throw 'Fresh database initializer did not refuse an existing database.' }
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run packaged WPF smoke
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'localerp-release'
          $package = Get-ChildItem $releaseRoot -Directory -Filter 'LocalErp-*-win-x64' | Select-Object -First 1
          if ($null -eq $package) { throw 'Packaged release directory was not found.' }
          $app = Join-Path $package.FullName 'app\LocalErp.Desktop.exe'
          $migrator = Join-Path $package.FullName 'database\LocalErp.DatabaseMigrator.exe'
          ./scripts/smoke-wpf.ps1 -Configuration Release -ExecutablePath $app -MigrationBundlePath $migrator

      - name: Upload Windows portable QA package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: localerp-windows-portable
          path: ${{ runner.temp }}/localerp-release/LocalErp-*.zip*
          if-no-files-found: error
          retention-days: 7

      - name: Upload code coverage baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localerp-code-coverage
          path: |
            local-erp/artifacts/coverage/coverage.cobertura.xml
            local-erp/artifacts/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localerp-test-results
          path: local-erp/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
