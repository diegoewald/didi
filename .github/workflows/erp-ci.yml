name: ERP RBAC Finalization

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - '.github/workflows/erp-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Consolidate validated ERP source
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Reconstruct validated ERP source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'erp-ci/source.part*' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, found $($parts.Count)." }
          $contents = @($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() })
          if ($contents[3].Length -eq 11999) { $contents[3] = $contents[3].Insert(8465, 'i') }
          $expectedLengths = @(12000,12000,12000,12000,12000,12000,12000,12000,1540)
          for ($i = 0; $i -lt $contents.Count; $i++) {
            if ($contents[$i].Length -ne $expectedLengths[$i]) {
              throw "Unexpected length for source.part$($i.ToString('00')): $($contents[$i].Length)."
            }
          }
          $baseZip = Join-Path $env:RUNNER_TEMP 'local-erp.zip'
          [IO.File]::WriteAllBytes($baseZip, [Convert]::FromBase64String($contents -join ''))
          $baseHash = (Get-FileHash -Path $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne '19f6a2d523b19e29bfa842b31e6a72a7b24a33194eda1aaf5771a60eaaf09001') { throw 'ERP base integrity check failed.' }
          New-Item -ItemType Directory -Force 'erp-work' | Out-Null
          Expand-Archive -Path $baseZip -DestinationPath 'erp-work' -Force
          $workRoot = (Resolve-Path 'erp-work').Path

          if (Test-Path 'erp-ci/overlay') {
            $overlayRoot = (Resolve-Path 'erp-ci/overlay').Path
            Get-ChildItem $overlayRoot -File -Recurse | ForEach-Object {
              $relativePath = [IO.Path]::GetRelativePath($overlayRoot, $_.FullName)
              $targetPath = Join-Path $workRoot $relativePath
              New-Item -ItemType Directory -Force (Split-Path $targetPath) | Out-Null
              Copy-Item $_.FullName $targetPath -Force
            }
          }

          $rbacPartNames = @('part00.bin','part01.bin','part02.bin','part03.bin','part04a.bin','part04b.bin','part05a.bin','part05b.bin')
          $rbacZip = Join-Path $env:RUNNER_TEMP 'rbac-overlay.zip'
          $stream = [IO.File]::Open($rbacZip, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            foreach ($name in $rbacPartNames) {
              $path = Join-Path 'erp-transport/rbac-v1' $name
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          }
          finally { $stream.Dispose() }
          if ((Get-Item $rbacZip).Length -ne 21642) { throw 'Unexpected RBAC payload length.' }
          $rbacHash = (Get-FileHash -Path $rbacZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rbacHash -ne '61e707667d2cdebfd90530e0b22830d1511d79e460d50be302b7c4532dc40a9a') { throw 'RBAC payload integrity check failed.' }
          $rbacExtract = Join-Path $env:RUNNER_TEMP 'rbac-overlay'
          Expand-Archive -Path $rbacZip -DestinationPath $rbacExtract -Force
          Get-ChildItem $rbacExtract -File -Recurse | ForEach-Object {
            $relativePath = [IO.Path]::GetRelativePath($rbacExtract, $_.FullName)
            $targetPath = Join-Path $workRoot $relativePath
            New-Item -ItemType Directory -Force (Split-Path $targetPath) | Out-Null
            Copy-Item $_.FullName $targetPath -Force
          }

          Remove-Item 'erp-work/src/LocalErp.Domain/Security/RolePermission.cs' -Force -ErrorAction SilentlyContinue
          Remove-Item 'erp-work/src/LocalErp.Persistence/Configurations/RolePermissionConfiguration.cs' -Force -ErrorAction SilentlyContinue
          if (Test-Path 'ci-payload/fix') {
            $fixRoot = (Resolve-Path 'ci-payload/fix').Path
            Get-ChildItem $fixRoot -File -Recurse | ForEach-Object {
              $relativePath = [IO.Path]::GetRelativePath($fixRoot, $_.FullName)
              $targetPath = Join-Path $workRoot $relativePath
              New-Item -ItemType Directory -Force (Split-Path $targetPath) | Out-Null
              Copy-Item $_.FullName $targetPath -Force
            }
          }

      - name: Record RBAC milestone documentation
        shell: pwsh
        run: |
          function Append-Milestone([string]$Path, [string]$Marker, [string[]]$Lines) {
            if (-not (Test-Path $Path)) { return }
            $current = Get-Content $Path -Raw
            if ($current -notmatch [Regex]::Escape($Marker)) {
              Add-Content -Path $Path -Value ''
              Add-Content -Path $Path -Value $Lines
              Add-Content -Path $Path -Value ''
            }
          }

          Append-Milestone 'erp-work/CHANGELOG.md' 'RBAC baseline validated — 2026-10-16' @(
            '## RBAC baseline validated — 2026-10-16',
            '',
            '- Local users, password hashing, in-memory session and role-based authorization are implemented.',
            '- Roles map to permissions through `RolePermissions`; users map to roles through `UserRoles`.',
            '- Authorization is deny-by-default for protected application operations.',
            '- EF Core migration `AddRbacAuthorization` is validated against the current model.',
            '- Windows CI baseline: Release build with 0 warnings / 0 errors and 53/53 tests passing.',
            '- Migration validation: no pending model changes, apply -> rollback to 0 -> reapply passing.'
          )
          Append-Milestone 'erp-work/docs/TESTING.md' 'RBAC validated baseline (2026-10-16)' @(
            '## RBAC validated baseline (2026-10-16)',
            '',
            'Windows Server 2025 with .NET SDK 10.0.402:',
            '',
            '- Domain: 13/13 tests passed.',
            '- Application: 20/20 tests passed.',
            '- Persistence: 14/14 tests passed.',
            '- Infrastructure: 6/6 tests passed.',
            '- Total: 53/53 tests passed.',
            '- Release build: 0 warnings / 0 errors.',
            '- EF Core 10.0.13: `has-pending-model-changes` passed.',
            '- Database migration cycle: apply all -> rollback to 0 -> reapply all passed.'
          )
          Append-Milestone 'erp-work/docs/SECURITY.md' 'RBAC authorization baseline (2026-10-16)' @(
            '## RBAC authorization baseline (2026-10-16)',
            '',
            'Authorization uses role-based access control (RBAC):',
            '',
            '- permissions are assigned to roles;',
            '- users receive one or more roles;',
            '- protected application operations deny access by default unless the current user has the required permission;',
            '- normalized role names are unique;',
            '- role-permission and user-role associations are protected by relational foreign keys;',
            '- password hashes remain restricted to Domain/Persistence boundaries and are not exposed in application result DTOs.',
            '',
            'The secure bootstrap for the first administrator, lockout policy and security audit trail remain separate follow-up work and must not be bypassed by special-case authorization shortcuts.'
          )
          Append-Milestone 'erp-work/docs/ROADMAP.md' 'Security / RBAC status — 2026-10-16' @(
            '## Security / RBAC status — 2026-10-16',
            '',
            '- [x] Password hashing abstraction and implementation.',
            '- [x] Local users with normalized unique usernames.',
            '- [x] Authentication service and in-memory user session.',
            '- [x] Roles and permissions.',
            '- [x] User-role and role-permission persistence.',
            '- [x] Deny-by-default authorization service.',
            '- [x] `AddRbacAuthorization` migration validated.',
            '- [ ] Secure first-administrator bootstrap.',
            '- [ ] Login lockout / throttling policy.',
            '- [ ] Security audit trail.'
          )
          Append-Milestone 'erp-work/tasks/BACKLOG.md' 'RBAC milestone closed — 2026-10-16' @(
            '## RBAC milestone closed — 2026-10-16',
            '',
            'Completed:',
            '- [x] Password hashing baseline.',
            '- [x] Local users and authentication/session baseline.',
            '- [x] Roles, permissions and authorization.',
            '- [x] SQLite foreign-key persistence for users/roles/permissions.',
            '- [x] RBAC migration consistency and rollback/reapply validation.',
            '',
            'Next security slice:',
            '- [ ] Implement secure bootstrap of the first administrator without bypassing normal authorization after initialization.',
            '- [ ] Add lockout/throttling and authentication security audit events.'
          )
          Append-Milestone 'erp-work/README.md' 'RBAC milestone (2026-10-16)' @(
            '## RBAC milestone (2026-10-16)',
            '',
            'The current security foundation includes local users, password hashing, authenticated in-memory session, roles, permissions and deny-by-default authorization. The validated Windows CI baseline is 53/53 tests with the full EF Core migration cycle passing.'
          )

      - name: Add permanent project CI workflow
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'erp-work/.github/workflows' | Out-Null
          $projectCi = @(
            'name: Local ERP CI',
            '',
            'on:',
            '  push:',
            '  pull_request:',
            '',
            'permissions:',
            '  contents: read',
            '',
            'jobs:',
            '  validate:',
            '    runs-on: windows-2025',
            '    timeout-minutes: 20',
            '    steps:',
            '      - uses: actions/checkout@v7',
            '      - uses: actions/setup-dotnet@v6',
            '        with:',
            "          dotnet-version: '10.0.x'",
            '      - run: dotnet tool restore',
            '      - run: dotnet restore LocalErp.sln',
            '      - run: dotnet build LocalErp.sln --configuration Release --no-restore',
            '      - run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"',
            '      - run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - shell: pwsh',
            "        run: Remove-Item (Join-Path `$env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue",
            '      - run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext'
          )
          Set-Content 'erp-work/.github/workflows/ci.yml' -Value $projectCi -Encoding utf8

      - name: Materialize ERP and permanent branch CI
        shell: pwsh
        run: |
          Get-ChildItem 'erp-work' -Directory -Recurse -Force | Where-Object { $_.Name -in @('bin','obj','TestResults') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'erp-work/.git' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'local-erp' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'erp-work' 'local-erp' -Recurse
          Remove-Item 'erp-ci','erp-transport','ci-payload' -Recurse -Force -ErrorAction SilentlyContinue

          $branchCi = @(
            'name: ERP Permanent CI',
            '',
            'on:',
            '  push:',
            '    branches:',
            '      - erp-local-ci',
            '    paths:',
            "      - 'local-erp/**'",
            "      - '.github/workflows/erp-ci.yml'",
            '  workflow_dispatch:',
            '',
            'permissions:',
            '  contents: read',
            '',
            'jobs:',
            '  validate:',
            '    runs-on: windows-2025',
            '    timeout-minutes: 20',
            '    defaults:',
            '      run:',
            '        working-directory: local-erp',
            '    steps:',
            '      - uses: actions/checkout@v7',
            '      - uses: actions/setup-dotnet@v6',
            '        with:',
            "          dotnet-version: '10.0.x'",
            '      - run: dotnet tool restore',
            '      - run: dotnet restore LocalErp.sln',
            '      - run: dotnet build LocalErp.sln --configuration Release --no-restore',
            '      - run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"',
            '      - run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - shell: pwsh',
            '        working-directory: .',
            "        run: Remove-Item (Join-Path `$env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue",
            '      - run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext',
            '      - if: always()',
            '        uses: actions/upload-artifact@v7',
            '        with:',
            '          name: localerp-test-results',
            '          path: local-erp/**/TestResults/*.trx',
            '          if-no-files-found: warn',
            '          retention-days: 7'
          )
          Set-Content '.github/workflows/erp-ci.yml' -Value $branchCi -Encoding utf8

      - name: Commit consolidated ERP source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(erp): consolidate validated RBAC milestone'
          git push origin HEAD:erp-local-ci

      - name: Create RBAC milestone package
        shell: pwsh
        run: Compress-Archive -Path 'local-erp/*' -DestinationPath 'local-erp-v0.1.0-rbac.zip' -Force

      - name: Upload RBAC milestone package
        uses: actions/upload-artifact@v7
        with:
          name: local-erp-v0.1.0-rbac
          path: local-erp-v0.1.0-rbac.zip
          retention-days: 30
