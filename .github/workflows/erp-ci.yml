name: ERP Transport Verification

on:
  push:
    branches:
      - erp-local-ci
    paths:
      - 'erp-transport/**'
      - '.github/workflows/erp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-transport:
    name: Verify RBAC payload transport
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v7

      - name: Reconstruct RBAC payload and verify SHA-256
        shell: pwsh
        run: |
          $partNames = @(
            'part00.bin',
            'part01.bin',
            'part02.bin',
            'part03.bin',
            'part04a.bin',
            'part04b.bin',
            'part05a.bin',
            'part05b.bin'
          )

          $root = 'erp-transport/rbac-v1'
          $zipPath = Join-Path $env:RUNNER_TEMP 'rbac-overlay.zip'
          $stream = [IO.File]::Open($zipPath, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            foreach ($name in $partNames) {
              $path = Join-Path $root $name
              if (-not (Test-Path $path)) { throw "Missing transport part: $name" }
              $bytes = [IO.File]::ReadAllBytes($path)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          }
          finally {
            $stream.Dispose()
          }

          $length = (Get-Item $zipPath).Length
          if ($length -ne 21642) { throw "Unexpected payload length: $length" }

          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '61e707667d2cdebfd90530e0b22830d1511d79e460d50be302b7c4532dc40a9a'
          if ($actualHash -ne $expectedHash) {
            throw "RBAC payload SHA-256 mismatch. Expected $expectedHash, got $actualHash."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'rbac-overlay'
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $files = Get-ChildItem $extractRoot -File -Recurse
          if ($files.Count -ne 28) { throw "Expected 28 RBAC files, found $($files.Count)." }

          $required = @(
            'src/LocalErp.Domain/Security/Role.cs',
            'src/LocalErp.Application/Security/AuthorizationService.cs',
            'src/LocalErp.Persistence/Repositories/EfRoleRepository.cs',
            'tests/LocalErp.Persistence.Tests/EfRoleAuthorizationTests.cs'
          )
          foreach ($relativePath in $required) {
            if (-not (Test-Path (Join-Path $extractRoot $relativePath))) {
              throw "Expected file missing after reconstruction: $relativePath"
            }
          }

          Write-Host "RBAC transport verified: $length bytes, SHA-256 $actualHash, $($files.Count) files."
