name: ERP Windows CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, generate and test local user migration
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v7

      - name: Reconstruct and verify ERP source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'erp-ci/source.part*' | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, found $($parts.Count)." }
          $contents = @($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() })
          if ($contents[3].Length -eq 11999) { $contents[3] = $contents[3].Insert(8465, 'i') }
          $expectedLengths = @(12000,12000,12000,12000,12000,12000,12000,12000,1540)
          for ($i = 0; $i -lt $contents.Count; $i++) {
            if ($contents[$i].Length -ne $expectedLengths[$i]) { throw "Unexpected length for source.part$($i.ToString('00')): $($contents[$i].Length)." }
          }
          $zipPath = Join-Path $env:RUNNER_TEMP 'local-erp.zip'
          [IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($contents -join ''))
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '19f6a2d523b19e29bfa842b31e6a72a7b24a33194eda1aaf5771a60eaaf09001'
          if ($actualHash -ne $expectedHash) { throw "ERP archive integrity check failed. Expected $expectedHash, got $actualHash." }
          New-Item -ItemType Directory -Force 'erp-work' | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath 'erp-work' -Force
          if (Test-Path 'erp-ci/overlay') {
            $overlayRoot = (Resolve-Path 'erp-ci/overlay').Path
            $workRoot = (Resolve-Path 'erp-work').Path
            Get-ChildItem $overlayRoot -File -Recurse | ForEach-Object {
              $relativePath = [IO.Path]::GetRelativePath($overlayRoot, $_.FullName)
              $targetPath = Join-Path $workRoot $relativePath
              New-Item -ItemType Directory -Force (Split-Path $targetPath) | Out-Null
              Copy-Item $_.FullName $targetPath -Force
            }
          }
          if (-not (Test-Path 'erp-work/LocalErp.sln')) { throw 'ERP source reconstruction failed: LocalErp.sln was not found.' }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        working-directory: erp-work
        run: dotnet tool restore

      - name: Restore dependencies
        working-directory: erp-work
        run: dotnet restore LocalErp.sln

      - name: Build Release
        working-directory: erp-work
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Generate AddLocalUsers migration
        working-directory: erp-work
        run: dotnet ef migrations add AddLocalUsers --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext --output-dir Migrations

      - name: Rebuild solution with generated migration
        working-directory: erp-work
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Run tests against generated migration
        working-directory: erp-work
        run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Verify generated model snapshot
        working-directory: erp-work
        run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Upload generated migrations
        uses: actions/upload-artifact@v7
        with:
          name: localerp-add-local-users-migration
          path: erp-work/src/LocalErp.Persistence/Migrations
          if-no-files-found: error
          retention-days: 7
