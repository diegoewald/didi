name: ERP Permanent CI

on:
  push:
    branches:
      - erp-local-ci
      - erp-wpf-smoke
    paths:
      - 'local-erp/**'
      - '.github/workflows/erp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-permanent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build test and validate database
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: local-erp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore EF tool
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore LocalErp.sln

      - name: Build Release
        run: dotnet build LocalErp.sln --configuration Release --no-restore

      - name: Build password hash benchmark tool
        run: dotnet build tools/LocalErp.PasswordHashBenchmark/LocalErp.PasswordHashBenchmark.csproj --configuration Release

      - name: Run tests
        run: dotnet test LocalErp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Run WPF smoke
        shell: pwsh
        run: ./scripts/smoke-wpf.ps1 -Configuration Release

      - name: Verify migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reset disposable database
        shell: pwsh
        working-directory: .\
        run: Remove-Item (Join-Path $env:TEMP 'LocalErp\DesignTime') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Apply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Roll back to zero
        run: dotnet ef database update 0 --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Reapply migrations
        run: dotnet ef database update --project src/LocalErp.Persistence/LocalErp.Persistence.csproj --startup-project src/LocalErp.Persistence/LocalErp.Persistence.csproj --context ErpDbContext

      - name: Package clean source snapshot
        shell: pwsh
        working-directory: .\
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'local-erp-package'
          $zip = Join-Path $env:RUNNER_TEMP 'local-erp-v0.1.0-auth-milestone.zip'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'local-erp' -Destination $stage -Recurse
          foreach ($name in @('bin', 'obj', 'TestResults')) {
            Get-ChildItem -Path $stage -Directory -Recurse -Filter $name -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Remove-Item -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $stage 'local-erp') -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload source snapshot
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: localerp-auth-milestone-source
          path: ${{ runner.temp }}/local-erp-v0.1.0-auth-milestone.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localerp-test-results
          path: local-erp/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
