<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperFut Manager</title>
  <style>
    :root{--bg:#07111f;--panel:#0e1b2e;--panel2:#13233b;--text:#eef6ff;--muted:#97a8c2;--line:#243a5e;--accent:#20d487;--accent2:#43a5ff;--danger:#ff5573;--warn:#ffd166;--good:#3ee28d;--shadow:0 18px 60px rgba(0,0,0,.35);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 0%,#173965 0,#07111f 36%,#050914 100%);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),#13a96c);color:#03140d;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(32,212,135,.18);transition:.15s transform,.15s filter}button:hover{transform:translateY(-1px);filter:brightness(1.06)}button.secondary{background:#182942;color:var(--text);box-shadow:none;border:1px solid var(--line)}button.danger{background:linear-gradient(135deg,#ff5573,#b92441);color:white}button.warn{background:linear-gradient(135deg,#ffd166,#e9961b);color:#1d1100}button.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}input,select{width:100%;background:#071426;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px}.app{min-height:100vh}.hero{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 0 45%,rgba(32,212,135,.08) 45% 47%,transparent 47%),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 90px);transform:rotate(-8deg)}.start-card{position:relative;width:min(760px,100%);background:linear-gradient(180deg,rgba(19,35,59,.94),rgba(9,18,33,.94));border:1px solid var(--line);border-radius:30px;padding:38px;box-shadow:var(--shadow);text-align:center}.logo{font-size:clamp(42px,8vw,86px);font-weight:1000;letter-spacing:-4px;margin:0}.ball{display:inline-grid;place-items:center;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a9b7c9 62%,#34445a);color:#07111f;margin-right:8px;vertical-align:middle}.subtitle{color:var(--muted);font-size:18px;margin:10px auto 28px;max-width:580px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{background:rgba(8,18,33,.92);border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;font-size:22px;margin-bottom:18px}.club-badge{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--club,#20d487);color:white;font-weight:1000;box-shadow:0 10px 24px rgba(0,0,0,.25)}.nav{display:grid;gap:8px}.nav button{justify-content:flex-start;text-align:left;color:var(--text);background:transparent;box-shadow:none;border:1px solid transparent}.nav button.active,.nav button:hover{background:#13233b;border-color:var(--line)}.content{padding:24px;max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.title h1{margin:0;font-size:34px}.title p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(19,35,59,.92),rgba(11,22,39,.92));border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.18)}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:var(--club,#20d487);opacity:.12}.stat small{color:var(--muted);display:block}.stat strong{font-size:24px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#102039;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800}.ok{color:var(--good)}.bad{color:var(--danger)}.draw{color:var(--warn)}.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#0a1628}th,td{padding:10px 12px;border-bottom:1px solid #1a2c49;text-align:left;white-space:nowrap}th{color:#b7c6db;font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#101f35;position:sticky;top:0}tr:hover td{background:#102039}.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.club-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;max-height:430px;overflow:auto;padding-right:4px}.club-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#0a1628;cursor:pointer}.club-card.selected{outline:2px solid var(--accent);background:#112a35}.bar{height:10px;background:#081426;border-radius:999px;overflow:hidden;border:1px solid #1b3152}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:50%}.news{display:grid;gap:10px}.news-item{padding:12px;border-radius:14px;background:#0a1628;border:1px solid var(--line);color:#d6e4f7}.match-events{max-height:360px;overflow:auto}.event{display:flex;gap:10px;padding:9px;border-bottom:1px solid #1b2f4d;color:#d9e7fb}.minute{color:var(--warn);font-weight:900;min-width:42px}.modal{position:fixed;inset:0;background:rgba(1,5,12,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-card{width:min(900px,100%);max-height:90vh;overflow:auto;background:#0d1b2f;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.toast{position:fixed;right:18px;bottom:18px;background:#102039;border:1px solid var(--line);padding:14px 16px;border-radius:16px;box-shadow:var(--shadow);display:none;z-index:30}.toast.show{display:block}.split{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.kbd{font-family:ui-monospace,monospace;background:#071426;border:1px solid var(--line);border-radius:8px;padding:2px 6px}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.mobile-menu{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.content{padding:16px}.grid.cols-2,.grid.cols-3,.grid.cols-4,.form-row{grid-template-columns:1fr}.topbar{display:block}.nav{grid-template-columns:repeat(2,1fr)}.logo{letter-spacing:-2px}}@media(max-width:560px){.start-card{padding:24px}.actions button{width:100%}.nav{grid-template-columns:1fr}th,td{padding:8px}.title h1{font-size:26px}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="modal" class="modal"><div class="modal-card" id="modalContent"></div></div>
  <div id="toast" class="toast"></div>
  <script>
    'use strict';
    const SAVE_KEY='superfut_manager_save_v1';
    const DIVISIONS=['Série A','Série B','Série C'];
    const POSITIONS=['GOL','DEF','MEI','ATA'];
    const TRAINING={leve:{name:'Leve',desc:'Moral + energia, evolução pequena.',energy:5,moral:4,form:1,ovr:.04,tactic:.5},tecnico:{name:'Técnico',desc:'Melhora overall lentamente.',energy:-6,moral:1,form:2,ovr:.18,tactic:1},fisico:{name:'Físico',desc:'Forma alta, desgaste maior.',energy:-12,moral:-1,form:6,ovr:.08,tactic:.5},tatico:{name:'Tático',desc:'Desempenho coletivo e organização.',energy:-7,moral:2,form:2,ovr:.06,tactic:5},descanso:{name:'Descanso',desc:'Recupera energia e reduz pressão.',energy:14,moral:2,form:-1,ovr:0,tactic:-1}};
    const TACTICS={Ofensiva:{attack:1.16,defense:.90,wear:8,label:'Ofensiva'},Equilibrada:{attack:1,defense:1,wear:5,label:'Equilibrada'},Defensiva:{attack:.86,defense:1.16,wear:4,label:'Defensiva'},'Contra-ataque':{attack:1.06,defense:1.04,wear:6,label:'Contra-ataque'}};
    const FIRST_NAMES=['Caio','Renan','Davi','Bruno','Igor','Luan','Rafael','Nicolas','Heitor','Breno','Vitor','Samuel','Enzo','Theo','Otávio','Danilo','Alan','César','Iago','Mauro','Leandro','Murilo','Jonas','Pablo','Tales','Cauã','Rian','Sandro','Matheus','Eliel','Noah','Gael','Arthur','Raul','Lucas','André','Fábio','Diego','Wesley','Marcos'];
    const LAST_NAMES=['Silveira','Monteiro','Barbosa','Siqueira','Ferraz','Duarte','Pereira','Macedo','Ribeiro','Campos','Azevedo','Moura','Freitas','Sales','Queiroz','Nogueira','Bittencourt','Assunção','Valença','Lacerda','Tavares','Vieira','Lima','Borges','Cardoso','Pacheco','Farias','Rezende','Amaral','Castro'];
    const CLUB_TEMPLATES=[
      ['Rubro Carioca','Série A',82,74000000,3200000,'Caldeirão Rubro',57000,86,'#d92535'],['Alvinegro Paulista','Série A',81,70000000,3000000,'Arena Alvinegra',54000,85,'#111827'],['Verde Palestra','Série A',83,80000000,3100000,'Parque Verde',56000,88,'#129447'],['Tricolor Gaúcho','Série A',80,65000000,2600000,'Monumental Tricolor',52000,83,'#2b68d8'],['Azul Mineiro','Série A',79,63000000,2300000,'Toca Azul',48000,82,'#1e72d8'],['Leão do Nordeste','Série A',78,52000000,2100000,'Covil do Leão',46000,80,'#f59e0b'],['Furacão Sulista','Série A',77,50000000,1700000,'Arena Ventania',43000,78,'#ef4444'],['Peixe Praiano','Série A',76,47000000,1800000,'Vila Oceânica',36000,77,'#94a3b8'],['Cruzado Carioca','Série A',75,45000000,1900000,'São Januário Novo',35000,76,'#111827'],['Imortal Porto','Série A',78,53000000,2200000,'Arena do Porto',50000,81,'#3b82f6'],['Colorado do Sul','Série A',77,51000000,2000000,'Gigante Vermelho',51000,80,'#dc2626'],['Estrela Baiana','Série A',74,42000000,1500000,'Fonte Estelar',42000,74,'#ef4444'],
      ['Auriverde Campinas','Série B',70,27000000,820000,'Brinco Dourado',29000,67,'#22c55e'],['Operário Serrano','Série B',69,25000000,730000,'Vila Serrana',25000,65,'#334155'],['Tigre Catarinense','Série B',68,23500000,690000,'Heriberto Tigre',24000,64,'#f97316'],['Dragão Goiano','Série B',70,28000000,760000,'Ninho do Dragão',30000,68,'#dc2626'],['Baleia Potiguar','Série B',66,20500000,540000,'Frasqueirão Azul',21000,61,'#0ea5e9'],['Galo do Oeste','Série B',67,22000000,610000,'Terreiro do Galo',23000,62,'#111827'],['Papagaio Alagoano','Série B',65,19000000,500000,'Rei Verde',20000,60,'#16a34a'],['Rubro Capixaba','Série B',66,20000000,520000,'Kleber Novo',22000,61,'#b91c1c'],['Lobo Paranaense','Série B',68,24000000,640000,'Bosque do Lobo',26000,64,'#166534'],['Marujo Paraense','Série B',67,22500000,670000,'Baenão do Norte',24000,63,'#2563eb'],['Ferroviário Central','Série B',64,18000000,430000,'Trilho Central',18000,58,'#7c2d12'],['Águia Paulista','Série B',65,19500000,450000,'Ninho Paulista',19000,59,'#1d4ed8'],
      ['Cacique Amazônico','Série C',60,9000000,260000,'Aldeia Verde',15000,50,'#15803d'],['Carcará Sertanejo','Série C',61,9800000,300000,'Asa Branca',16000,52,'#facc15'],['Tubarão Litorâneo','Série C',59,8200000,220000,'Onda Forte',14000,49,'#0891b2'],['Javali do Cerrado','Série C',58,7600000,200000,'Toca do Javali',13000,47,'#92400e'],['Vulcão Pernambucano','Série C',62,10500000,340000,'Cratera Rubra',17000,54,'#b91c1c'],['Canário do Vale','Série C',57,7000000,180000,'Vale Amarelo',12000,45,'#eab308'],['Rinoceronte Paulista','Série C',60,9200000,250000,'Chifre de Aço',15000,51,'#64748b'],['Íbis Urbano','Série C',56,6500000,160000,'Ninho Urbano',11000,44,'#ef4444'],['Boto do Norte','Série C',59,8300000,210000,'Rio Encantado',13500,48,'#0284c7'],['Cometa Mineiro','Série C',58,7800000,190000,'Arena Cometa',12500,46,'#60a5fa'],['Guará Candango','Série C',61,10000000,280000,'Serra Dourada Nova',16000,53,'#f97316'],['Pioneiro Gaúcho','Série C',57,7200000,175000,'Campo Pioneiro',12000,45,'#0f172a']
    ];
    let game=null;
    let selectedClubId=null;
    let careerDivision='Série A';
    let careerLength='media';
    const $=sel=>document.querySelector(sel);
    const app=$('#app');
    const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
    const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(Math.round(n||0));
    const pct=n=>Math.round(n)+'%';
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function createClubs(){return CLUB_TEMPLATES.map((c,i)=>({id:'club_'+i,name:c[0],division:c[1],strength:c[2],budget:c[3],cash:c[3],fans:c[4],stadium:c[5],capacity:c[6],reputation:c[7],color:c[8],players:createPlayers(c[2]),youth:[],youthLevel:rnd(1,3),tactical:rnd(45,60),form:50,history:[]}));}
    function createPlayers(base){const arr=[];[['GOL',2],['DEF',4],['MEI',4],['ATA',3]].forEach(([pos,q])=>{for(let i=0;i<q;i++)arr.push(createPlayer(pos,base));});return arr;}
    function createPlayer(pos,base,young=false){const age=young?rnd(15,20):rnd(18,36);const overall=clamp(Math.round(base+rnd(-9,8)+(young?-10:0)),36,94);const potential=clamp(overall+rnd(young?8:0,young?27:16)-(age>30?rnd(4,12):0),overall,99);const value=calcValue(overall,potential,age);return {id:uid(),name:pick(FIRST_NAMES)+' '+pick(LAST_NAMES),age,pos,overall,potential,salary:Math.round(value/90+rnd(8000,55000)),value,moral:rnd(48,78),energy:rnd(72,100),form:rnd(45,75),contract:rnd(1,5),starter:false,goals:0,assists:0,rating:0,injury:0};}
    function calcValue(ovr,pot,age){const ageMul=age<21?1.55:age<25?1.25:age<30?1:age<34?.72:.42;return Math.round((ovr*ovr*10500+(pot-ovr)*165000)*ageMul);}
    function generateMarket(){const list=[];for(let i=0;i<22;i++){const pos=pick(POSITIONS);const base=rnd(52,83);const p=createPlayer(pos,base,Math.random()<.25);p.value=Math.round(p.value*(1.12+Math.random()*.34));p.salary=Math.round(p.salary*1.08);list.push(p)}return list;}
    function blankStats(clubs){const s={};clubs.forEach(c=>s[c.id]={clubId:c.id,played:0,points:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0});return s;}
    function initGame(){renderStart();}
    function newCareer(){const clubs=createClubs();selectedClubId=clubs.find(c=>c.division===careerDivision)?.id;app.innerHTML=`<section class="hero"><div class="start-card" style="text-align:left"><h1 class="logo"><span class="ball">⚽</span>SuperFut Manager</h1><p class="subtitle">Monte sua carreira, escolha o desafio e tente conquistar o Brasil, o continente e o mundo.</p><div class="grid"><div class="card"><label>Nome do treinador</label><input id="coachName" value="Treinador Silva" maxlength="28"></div><div class="form-row"><div><label>Divisão inicial</label><select id="divisionSel">${DIVISIONS.map(d=>`<option>${d}</option>`).join('')}</select></div><div><label>Temporada</label><select id="lengthSel"><option value="curta">Curta (11 rodadas)</option><option value="media" selected>Média (22 rodadas)</option><option value="longa">Longa (33 rodadas)</option></select></div><div><label>Tática inicial</label><select id="tacticSel">${Object.keys(TACTICS).map(t=>`<option>${t}</option>`).join('')}</select></div></div><div><h3>Escolha seu clube</h3><div id="clubList" class="club-list"></div></div><div class="footer-actions"><button class="secondary" onclick="renderStart()">Voltar</button><button onclick="startGame()">Iniciar carreira</button></div></div></div></section>`;$('#divisionSel').onchange=e=>{careerDivision=e.target.value;selectedClubId=clubs.find(c=>c.division===careerDivision).id;renderClubChoices(clubs)};$('#lengthSel').onchange=e=>careerLength=e.target.value;window.tempClubs=clubs;renderClubChoices(clubs);}
    function renderClubChoices(clubs){const div=$('#clubList');div.innerHTML=clubs.filter(c=>c.division===careerDivision).map(c=>`<div class="club-card ${c.id===selectedClubId?'selected':''}" onclick="selectedClubId='${c.id}';renderClubChoices(window.tempClubs)" style="border-color:${c.color}"><div class="split"><span class="club-badge" style="--club:${c.color}">${c.name[0]}</span><div><strong>${c.name}</strong><br><span class="muted">${c.stadium} • ${c.capacity.toLocaleString('pt-BR')} lugares</span></div></div><p><span class="pill">Dificuldade ${c.strength>78?'Baixa':c.strength>66?'Média':'Alta'}</span> <span class="pill">Força ${c.strength}</span></p><div class="grid cols-3"><small>Orçamento<br><b>${money(c.budget)}</b></small><small>Torcida<br><b>${c.fans.toLocaleString('pt-BR')}</b></small><small>Elenco<br><b>${Math.round(avg(c.players.map(p=>p.overall)))}</b></small></div></div>`).join('');}
    function startGame(){const clubs=window.tempClubs||createClubs();const playerClub=clubs.find(c=>c.id===selectedClubId)||clubs[0];playerClub.players.slice().sort((a,b)=>b.overall-a.overall).slice(0,11).forEach(p=>p.starter=true);const rounds={curta:11,media:22,longa:33}[careerLength]||22;game={coach:$('#coachName').value.trim()||'Treinador Silva',clubs,playerClubId:playerClub.id,season:2026,round:1,maxRounds:rounds,length:careerLength,tactic:$('#tacticSel').value,cash:playerClub.cash,morale:62,board:60,fansMood:60,market:generateMarket(),news:[],finance:{revenue:0,expense:0,last:[],transfersIn:0,transfersOut:0,prizes:0},league:blankStats(clubs),cup:createCup('Copa Nacional',clubs,1200000),continental:null,world:null,currentView:'dashboard',nextOpponentId:null,lastMatch:null,seasonGoals:[],offers:[]};addNews('Você foi apresentado no '+playerClub.name+' com promessa de futebol competitivo.');chooseNextOpponent();saveGame(false);renderApp();}
    function renderStart(){const has=!!localStorage.getItem(SAVE_KEY);app.innerHTML=`<section class="hero"><div class="start-card"><h1 class="logo"><span class="ball">⚽</span>SuperFut Manager</h1><p class="subtitle">Um manager brasileiro completo, fictício, offline e salvo no navegador. Escolha um clube, escale titulares, treine, negocie, dispute ligas e construa uma dinastia.</p><div class="actions"><button onclick="newCareer()">Novo Jogo</button><button class="secondary" ${has?'':'disabled'} onclick="loadGame()">Continuar</button><button class="danger" ${has?'':'disabled'} onclick="deleteSave()">Apagar Save</button></div></div></section>`;}
    function renderApp(){const c=club();document.body.style.setProperty('--club',c.color);app.innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><span class="club-badge">${c.name[0]}</span><span>SuperFut<br><small class="muted">${c.name}</small></span></div><div class="nav">${[['dashboard','Dashboard'],['squad','Elenco'],['training','Treino'],['market','Mercado'],['youth','Base'],['finances','Finanças'],['competitions','Competições'],['match','Próximo Jogo']].map(([id,label])=>`<button class="${game.currentView===id?'active':''}" onclick="show('${id}')">${label}</button>`).join('')}<button class="secondary" onclick="saveGame(true)">Salvar</button></div></aside><main class="content" id="view"></main></div>`;renderView();}
    function show(v){game.currentView=v;renderApp();}
    function renderView(){({dashboard:renderDashboard,squad:renderSquad,training:renderTraining,market:renderMarket,youth:renderYouth,finances:renderFinances,competitions:renderCompetitions,match:renderMatch}[game.currentView]||renderDashboard)();}
    function club(){return game.clubs.find(c=>c.id===game.playerClubId);}
    function opponent(){return game.clubs.find(c=>c.id===game.nextOpponentId);}
    function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
    function starters(){return club().players.filter(p=>p.starter);}
    function teamPower(c=club(),isUser=c.id===game.playerClubId){const ps=isUser?starters():c.players.slice().sort((a,b)=>b.overall-a.overall).slice(0,11);const base=avg(ps.map(p=>p.overall*(.78+p.moral/450+p.energy/520+p.form/520)));return base+(c.tactical||50)/12+(isUser?game.morale/20:0)+(c.form-50)/8;}
    function leaguePosition(){return sortedTable().findIndex(s=>s.clubId===game.playerClubId)+1;}
    function renderDashboard(){const c=club(),opp=opponent();$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Dashboard</h1><p>${game.coach} no comando do ${c.name} • Temporada ${game.season}</p></div><button onclick="saveGame(true)">Salvar jogo</button></div><div class="grid cols-4"><div class="card stat"><small>Rodada</small><strong>${game.round}/${game.maxRounds}</strong></div><div class="card stat"><small>Próximo adversário</small><strong>${opp?opp.name:'A definir'}</strong></div><div class="card stat"><small>Posição na liga</small><strong>${leaguePosition()}º</strong></div><div class="card stat"><small>Caixa</small><strong>${money(game.cash)}</strong></div><div class="card stat"><small>Moral do elenco</small><strong>${pct(game.morale)}</strong></div><div class="card stat"><small>Confiança da diretoria</small><strong>${pct(game.board)}</strong></div><div class="card stat"><small>Torcida</small><strong>${pct(game.fansMood)}</strong></div><div class="card stat"><small>Tática</small><strong>${game.tactic}</strong></div></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h2>Notícias do clube</h2><div class="news">${game.news.slice(0,8).map(n=>`<div class="news-item">${esc(n)}</div>`).join('')||'<p class="muted">Sem notícias por enquanto.</p>'}</div></div><div class="card"><h2>Ações rápidas</h2><div class="grid cols-2"><button onclick="show('squad')">Ajustar escalação</button><button onclick="show('training')">Aplicar treino</button><button onclick="show('market')">Abrir mercado</button><button onclick="show('match')">Jogar próxima partida</button></div><h3>Momento</h3><p class="muted">Força estimada dos titulares: <b>${teamPower().toFixed(1)}</b>. Titulares escalados: <b>${starters().length}/11</b>.</p><div class="bar"><span style="width:${clamp(teamPower(),0,100)}%"></span></div></div></div>`;}
    function renderSquad(){const rows=club().players.slice().sort((a,b)=>POSITIONS.indexOf(a.pos)-POSITIONS.indexOf(b.pos)||b.overall-a.overall).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.age}</td><td>${p.pos}</td><td>${p.overall}</td><td>${p.potential}</td><td>${p.moral}</td><td>${p.energy}</td><td>${money(p.salary)}</td><td>${money(p.value)}</td><td><button class="secondary" onclick="toggleStarter('${p.id}')">${p.starter?'Titular':'Reserva'}</button></td><td><button class="danger" onclick="sellPlayer('${p.id}')">Vender</button></td></tr>`).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Elenco</h1><p>Escolha 11 titulares. A força considera overall, moral, energia e forma.</p></div><span class="pill">Titulares ${starters().length}/11</span></div><div class="card"><div class="split"><label style="min-width:220px">Tática<select onchange="game.tactic=this.value;renderSquad()">${Object.keys(TACTICS).map(t=>`<option ${game.tactic===t?'selected':''}>${t}</option>`).join('')}</select></label><button onclick="autoLineup()">Escalar melhores</button></div><br><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Idade</th><th>Pos</th><th>Overall</th><th>Potencial</th><th>Moral</th><th>Energia</th><th>Salário</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
    function toggleStarter(id){const p=club().players.find(x=>x.id===id);if(!p)return;if(!p.starter&&starters().length>=11)return toast('A escalação já tem 11 titulares. Remova alguém primeiro.');p.starter=!p.starter;renderSquad();}
    function autoLineup(){club().players.forEach(p=>p.starter=false);club().players.slice().sort((a,b)=>b.overall-a.overall).slice(0,11).forEach(p=>p.starter=true);toast('Melhores 11 escalados.');renderSquad();}
    function renderTraining(){const cards=Object.entries(TRAINING).map(([k,t])=>`<div class="card"><h3>${t.name}</h3><p class="muted">${t.desc}</p><button onclick="doTraining('${k}')">Aplicar treino</button></div>`).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Treino</h1><p>Treinos afetam elenco inteiro. Exagerar no ritmo reduz energia antes dos jogos.</p></div><span class="pill">Organização tática ${club().tactical}</span></div><div class="grid cols-3">${cards}</div>`;}
    function doTraining(k){const t=TRAINING[k], c=club();let evolved=[];c.players.forEach(p=>{p.energy=clamp(p.energy+t.energy,0,100);p.moral=clamp(p.moral+t.moral,0,100);p.form=clamp(p.form+t.form,0,100);let chance=t.ovr*(p.age<23?1.8:p.age>31?.45:1);if(p.overall<p.potential&&Math.random()<chance){p.overall++;p.value=calcValue(p.overall,p.potential,p.age);evolved.push(p.name)}});c.tactical=clamp(c.tactical+t.tactic,0,100);game.morale=clamp(game.morale+t.moral,0,100);addNews(evolved.length?'Jovem promessa chama atenção no treino: '+evolved.slice(0,2).join(', '):'Treino '+t.name.toLowerCase()+' concluído pelo elenco.');toast('Treino aplicado. '+(evolved.length?evolved.length+' atleta(s) evoluíram.':'Sem evolução imediata.'));renderTraining();}
    function renderMarket(){maybeOffer();const players=game.market.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.age}</td><td>${p.pos}</td><td>${p.overall}</td><td>${p.potential}</td><td>${money(p.salary)}</td><td>${money(p.value)}</td><td><button onclick="buyPlayer('${p.id}')">Comprar</button></td></tr>`).join('');const offers=game.offers.map(o=>{const p=club().players.find(x=>x.id===o.playerId);return p?`<div class="news-item">Proposta por <b>${p.name}</b>: ${money(o.amount)} <button onclick="acceptOffer('${o.playerId}',${o.amount})">Aceitar</button> <button class="secondary" onclick="rejectOffer('${o.playerId}')">Recusar</button></div>`:''}).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Mercado</h1><p>Contrate reforços ou aceite propostas. Jogadores jovens e promissores custam mais.</p></div><span class="pill">Caixa ${money(game.cash)}</span></div><div class="grid cols-2"><div class="card"><h2>Disponíveis</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Idade</th><th>Pos</th><th>Ovr</th><th>Pot</th><th>Salário</th><th>Preço</th><th></th></tr></thead><tbody>${players}</tbody></table></div></div><div class="card"><h2>Propostas recebidas</h2><div class="news">${offers||'<p class="muted">Nenhuma proposta no momento.</p>'}</div><br><button class="secondary" onclick="game.market=generateMarket();renderMarket()">Atualizar lista</button></div></div>`;}
    function buyPlayer(id){const p=game.market.find(x=>x.id===id);if(!p)return;if(game.cash<p.value)return toast('Caixa insuficiente para contratar.');game.cash-=p.value;game.finance.expense+=p.value;game.finance.transfersIn+=p.value;club().players.push(p);game.market=game.market.filter(x=>x.id!==id);addNews('Reforço anunciado: '+p.name+' chega por '+money(p.value)+'.');toast('Jogador contratado.');renderMarket();}
    function sellPlayer(id){const p=club().players.find(x=>x.id===id);if(!p||club().players.length<=13)return toast('Você precisa manter ao menos 13 jogadores.');const amount=Math.round(p.value*(.82+Math.random()*.38));confirmModal('Venda de jogador',`Vender ${p.name} por ${money(amount)}?`,()=>acceptOffer(id,amount));}
    function acceptOffer(id,amount){const c=club(),p=c.players.find(x=>x.id===id);if(!p)return;c.players=c.players.filter(x=>x.id!==id);game.cash+=amount;game.finance.revenue+=amount;game.finance.transfersOut+=amount;game.offers=game.offers.filter(o=>o.playerId!==id);addNews('Jogador vendido: '+p.name+' por '+money(amount)+'.');toast('Venda concluída.');renderView();}
    function rejectOffer(id){game.offers=game.offers.filter(o=>o.playerId!==id);renderMarket();}
    function maybeOffer(){if(Math.random()<.18&&game.offers.length<3){const p=pick(club().players);if(p&&!game.offers.some(o=>o.playerId===p.id)){const amount=Math.round(p.value*(.9+Math.random()*.55));game.offers.push({playerId:p.id,amount});addNews('Jogador recebe proposta milionária: '+p.name+'.')}}}
    function renderYouth(){const c=club();const youth=c.youth.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.age}</td><td>${p.pos}</td><td>${p.overall}</td><td>${p.potential}</td><td>${money(p.value)}</td><td><button onclick="promoteYouth('${p.id}')">Promover</button></td></tr>`).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Categoria de Base</h1><p>Invista para revelar promessas entre 15 e 20 anos.</p></div><span class="pill">Estrutura nível ${c.youthLevel}</span></div><div class="grid cols-3"><div class="card"><h3>Observação regional</h3><p class="muted">Custo ${money(500000)}. Chance moderada.</p><button onclick="revealYouth(500000)">Revelar jovem</button></div><div class="card"><h3>Peneira nacional</h3><p class="muted">Custo ${money(1500000)}. Maior potencial.</p><button onclick="revealYouth(1500000)">Investir forte</button></div><div class="card"><h3>Melhorar estrutura</h3><p class="muted">Custo ${money(c.youthLevel*2500000)}. Aumenta potencial futuro.</p><button onclick="upgradeYouth()">Melhorar base</button></div></div><div class="card" style="margin-top:16px"><h2>Jovens da base</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Idade</th><th>Pos</th><th>Ovr</th><th>Pot</th><th>Valor</th><th></th></tr></thead><tbody>${youth||'<tr><td colspan="7" class="muted">Nenhuma promessa revelada.</td></tr>'}</tbody></table></div></div>`;}
    function revealYouth(cost){if(game.cash<cost)return toast('Caixa insuficiente.');game.cash-=cost;game.finance.expense+=cost;const base=46+club().youthLevel*3+(cost>1000000?6:0);const p=createPlayer(pick(POSITIONS),base,true);p.potential=clamp(p.potential+rnd(club().youthLevel,club().youthLevel*5),p.overall,99);p.value=calcValue(p.overall,p.potential,p.age);club().youth.push(p);addNews('Jovem promessa chama atenção no treino: '+p.name+' da base.');renderYouth();}
    function upgradeYouth(){const cost=club().youthLevel*2500000;if(game.cash<cost)return toast('Caixa insuficiente.');game.cash-=cost;game.finance.expense+=cost;club().youthLevel++;addNews('Clube melhora estrutura da base para nível '+club().youthLevel+'.');renderYouth();}
    function promoteYouth(id){const c=club(),p=c.youth.find(x=>x.id===id);if(!p)return;p.contract=3;p.salary=Math.round(p.salary*.55);c.youth=c.youth.filter(x=>x.id!==id);c.players.push(p);addNews(p.name+' foi promovido ao profissional.');renderYouth();}
    function renderFinances(){const salary=club().players.reduce((s,p)=>s+p.salary,0);const rows=game.finance.last.slice(-8).reverse().map(f=>`<tr><td>${f.round}</td><td>${money(f.revenue)}</td><td>${money(f.expense)}</td><td class="${f.profit>=0?'ok':'bad'}">${money(f.profit)}</td><td>${money(f.cash)}</td></tr>`).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Finanças</h1><p>Controle caixa, salários, receitas e despesas por rodada.</p></div><span class="pill">Caixa ${money(game.cash)}</span></div><div class="grid cols-4"><div class="card stat"><small>Salários mensais</small><strong>${money(salary)}</strong></div><div class="card stat"><small>Receitas totais</small><strong>${money(game.finance.revenue)}</strong></div><div class="card stat"><small>Despesas totais</small><strong>${money(game.finance.expense)}</strong></div><div class="card stat"><small>Lucro/prejuízo</small><strong class="${game.finance.revenue-game.finance.expense>=0?'ok':'bad'}">${money(game.finance.revenue-game.finance.expense)}</strong></div></div><div class="card" style="margin-top:16px"><h2>Relatório por rodada</h2><div class="table-wrap"><table><thead><tr><th>Rodada</th><th>Receita</th><th>Despesa</th><th>Resultado</th><th>Caixa</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="muted">Sem movimentações registradas.</td></tr>'}</tbody></table></div></div>`;}
    function renderCompetitions(){const table=sortedTable().map((s,i)=>{const c=game.clubs.find(x=>x.id===s.clubId);return`<tr><td>${i+1}</td><td><b style="color:${c.color}">${c.name}</b></td><td>${s.points}</td><td>${s.played}</td><td>${s.wins}</td><td>${s.draws}</td><td>${s.losses}</td><td>${s.gd}</td><td>${s.gf}</td></tr>`}).join('');$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Competições</h1><p>Liga Nacional, Copa Nacional, Copa Continental e Mundial de Clubes.</p></div><button onclick="show('match')">Próximo jogo</button></div><div class="card"><h2>Liga Nacional</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Clube</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>GP</th></tr></thead><tbody>${table}</tbody></table></div></div><div class="grid cols-3" style="margin-top:16px"><div class="card"><h3>Copa Nacional</h3><p>${game.cup.active?'Fase '+game.cup.phase:'Finalizada'}</p><p class="muted">Premiação por fase: ${money(game.cup.prize)}</p></div><div class="card"><h3>Copa Continental</h3><p>${game.continental?game.continental.active?'Em disputa':'Finalizada':'Convite aos melhores da Série A no fim da temporada.'}</p></div><div class="card"><h3>Mundial de Clubes</h3><p>${game.world?game.world.active?'Em disputa':'Finalizado':'Classificação ao vencer a Copa Continental.'}</p></div></div>`;}
    function renderMatch(){const opp=opponent();$('#view').innerHTML=`<div class="topbar"><div class="title"><h1>Próximo Jogo</h1><p>${club().name} x ${opp?opp.name:'Adversário a definir'} • Rodada ${game.round}</p></div><span class="pill">Titulares ${starters().length}/11</span></div><div class="grid cols-2"><div class="card"><h2>Preparação</h2><p>Força do seu time: <b>${teamPower().toFixed(1)}</b></p><p>Força adversária: <b>${opp?teamPower(opp,false).toFixed(1):'-'}</b></p><label>Tática<select onchange="game.tactic=this.value;renderMatch()">${Object.keys(TACTICS).map(t=>`<option ${game.tactic===t?'selected':''}>${t}</option>`).join('')}</select></label><br><br><button ${starters().length!==11?'disabled':''} onclick="simulateMatch()">Jogar Próxima Partida</button><p class="muted">A escalação exige 11 titulares.</p></div><div class="card"><h2>Última partida</h2>${game.lastMatch?matchHtml(game.lastMatch):'<p class="muted">Nenhuma partida jogada ainda.</p>'}</div></div>`;}
    function matchHtml(m){return`<h3 class="${m.result==='V'?'ok':m.result==='D'?'bad':'draw'}">${m.home} ${m.hg} x ${m.ag} ${m.away}</h3><p><b>Melhor jogador:</b> ${m.best}</p><p><b>Público:</b> ${m.crowd.toLocaleString('pt-BR')} • <b>Renda:</b> ${money(m.income)}</p><div class="match-events">${m.events.map(e=>`<div class="event"><span class="minute">${e.min}'</span><span>${esc(e.text)}</span></div>`).join('')}</div>`;}
    function chooseNextOpponent(){const same=game.clubs.filter(c=>c.division===club().division&&c.id!==game.playerClubId);game.nextOpponentId=pick(same).id;}
    function simulateMatch(){if(starters().length!==11)return toast('Escale exatamente 11 titulares.');const c=club(),opp=opponent();const home=Math.random()<.55;const t=TACTICS[game.tactic];let my=teamPower(c,true)*(home?1.07:.98)*t.attack*(.92+Math.random()*.18);let op=teamPower(opp,false)*(home?.98:1.06)*(2-t.defense)*(.92+Math.random()*.18);const myGoals=goalsFrom(my,op),opGoals=goalsFrom(op,my);const result=myGoals>opGoals?'V':myGoals<opGoals?'D':'E';const crowd=Math.round(c.capacity*clamp((c.fans/c.capacity)/80+game.fansMood/130+Math.random()*.18,.25,1));const income=home?crowd*rnd(45,95):0;const shirts=Math.round(c.fans*(result==='V'?.34:result==='E'?.16:.08));const shirtIncome=shirts*rnd(8,16);const sponsor=Math.round(c.reputation*9000+(leaguePosition()<4?500000:0));const salary=c.players.reduce((s,p)=>s+p.salary,0);const maintenance=Math.round(c.capacity*7);const revenue=income+shirtIncome+sponsor;const expense=salary+maintenance;game.cash+=revenue-expense;game.finance.revenue+=revenue;game.finance.expense+=expense;game.finance.last.push({round:game.round,revenue,expense,profit:revenue-expense,cash:game.cash});updateStats(game.playerClubId,game.nextOpponentId,myGoals,opGoals);simulateOtherMatches();const events=buildEvents(c,opp,myGoals,opGoals,result);const best=pick(starters()).name;game.lastMatch={home:home?c.name:opp.name,away:home?opp.name:c.name,hg:home?myGoals:opGoals,ag:home?opGoals:myGoals,result,best,crowd,income,events};postMatchEffects(result,t.wear);addNews(result==='V'?'Torcida comemora grande vitória contra '+opp.name:result==='D'?'Diretoria cobra melhores resultados após derrota para '+opp.name:'Empate movimentado contra '+opp.name+' divide opiniões.');game.round++;ageAndEvolveRound();if(game.round>game.maxRounds){renderSeasonSummary();return}chooseNextOpponent();renderMatch();}
    function goalsFrom(a,d){const x=clamp((a-d+20)/18,0.15,2.9);let g=0;for(let i=0;i<5;i++)if(Math.random()<x/(i+2.2))g++;return clamp(g,0,6);}
    function updateStats(a,b,ga,gb){const A=game.league[a],B=game.league[b];A.played++;B.played++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;A.gd=A.gf-A.ga;B.gd=B.gf-B.ga;if(ga>gb){A.wins++;A.points+=3;B.losses++}else if(ga<gb){B.wins++;B.points+=3;A.losses++}else{A.draws++;B.draws++;A.points++;B.points++}}
    function simulateOtherMatches(){const div=club().division;const teams=game.clubs.filter(c=>c.division===div&&c.id!==game.playerClubId&&c.id!==game.nextOpponentId).sort(()=>Math.random()-.5);for(let i=0;i<teams.length-1;i+=2){const a=teams[i],b=teams[i+1];const ga=goalsFrom(teamPower(a,false),teamPower(b,false));const gb=goalsFrom(teamPower(b,false),teamPower(a,false));updateStats(a.id,b.id,ga,gb)}}
    function buildEvents(c,o,mg,og,res){const ev=[];for(let i=0;i<mg;i++)ev.push({min:rnd(3,92),text:'Gol do '+c.name+'! '+pick(starters()).name+' balança a rede.'});for(let i=0;i<og;i++)ev.push({min:rnd(3,92),text:'Gol do '+o.name+'. A defesa não conseguiu afastar.'});['Cartão amarelo após falta dura.','Defesa difícil do goleiro em chute colocado.','Bola na trave e suspiro da torcida.','Lesão leve, mas o atleta segue em campo.','Pressão nos acréscimos aumenta a tensão.'].forEach(t=>{if(Math.random()<.55)ev.push({min:rnd(10,90),text:t})});if(res==='V'&&Math.random()<.35)ev.push({min:90,text:'Gol nos acréscimos confirma a festa nas arquibancadas.'});return ev.sort((a,b)=>a.min-b.min);}
    function postMatchEffects(result,wear){const delta=result==='V'?8:result==='E'?1:-7;game.morale=clamp(game.morale+delta,0,100);game.board=clamp(game.board+(result==='V'?4:result==='E'?0:-5),0,100);game.fansMood=clamp(game.fansMood+(result==='V'?6:result==='E'?-1:-6),0,100);club().form=clamp(club().form+delta/2,0,100);club().players.forEach(p=>{p.energy=clamp(p.energy-(p.starter?wear:rnd(1,3)),0,100);p.moral=clamp(p.moral+delta+(p.starter?1:0),0,100);p.form=clamp(p.form+(result==='V'?3:result==='D'?-2:1),0,100);if(p.starter&&Math.random()<.08)p.goals++});if(result==='V'&&Math.random()<.4)addNews('Clube vende muitas camisas após sequência de vitórias.');}
    function ageAndEvolveRound(){game.clubs.forEach(c=>{c.players.forEach(p=>{if(p.age<24&&p.overall<p.potential&&Math.random()<.05)p.overall++;if(p.age>32&&Math.random()<.03)p.energy=clamp(p.energy-2,0,100);p.value=calcValue(p.overall,p.potential,p.age)})})}
    function sortedTable(){return Object.values(game.league).sort((a,b)=>b.points-a.points||b.wins-a.wins||b.gd-a.gd||b.gf-a.gf)}
    function updateLeagueTable(){return sortedTable();}
    function createCup(name,clubs,prize){return{name,active:true,phase:1,teams:clubs.map(c=>c.id),prize,winner:null}}
    function renderSeasonSummary(){const standings=sortedTable();const champ=game.clubs.find(c=>c.id===standings[0].clubId);const promoted=standings.slice(0,2).map(s=>game.clubs.find(c=>c.id===s.clubId).name);const relegated=standings.slice(-2).map(s=>game.clubs.find(c=>c.id===s.clubId).name);const profit=game.finance.revenue-game.finance.expense;const evolved=club().players.filter(p=>p.age<24&&p.overall<p.potential).slice(0,5).map(p=>p.name).join(', ')||'Sem destaques';const body=`<h1>Fim da temporada ${game.season}</h1><div class="grid cols-2"><div class="card"><h2>Resumo esportivo</h2><p>Campeão: <b>${champ.name}</b></p><p>Sua posição: <b>${leaguePosition()}º</b></p><p>Artilheiro: <b>${pick(club().players).name}</b></p><p>Melhor jogador: <b>${club().players.slice().sort((a,b)=>b.overall-a.overall)[0].name}</b></p><p>Promoções: ${promoted.join(', ')}</p><p>Rebaixamentos: ${relegated.join(', ')}</p></div><div class="card"><h2>Finanças e evolução</h2><p>Receita total: <b>${money(game.finance.revenue)}</b></p><p>Despesas: <b>${money(game.finance.expense)}</b></p><p>Lucro/prejuízo: <b class="${profit>=0?'ok':'bad'}">${money(profit)}</b></p><p>Jogadores promissores: ${evolved}</p></div></div><div class="footer-actions"><button onclick="closeModal();nextSeason()">Iniciar nova temporada</button></div>`;showModal(body);}
    function nextSeason(){game.season++;game.round=1;game.league=blankStats(game.clubs);game.market=generateMarket();game.cup=createCup('Copa Nacional',game.clubs,1200000+game.season);game.finance.last=[];game.clubs.forEach(c=>{c.strength=clamp(c.strength+rnd(-2,2),40,95);c.form=50;c.players.forEach(p=>{p.age++;p.contract=Math.max(0,p.contract-1);if(p.age<24&&p.overall<p.potential&&Math.random()<.35)p.overall++;if(p.age>33&&Math.random()<.45)p.overall=Math.max(35,p.overall-1);p.energy=90;p.moral=60;p.form=55;p.value=calcValue(p.overall,p.potential,p.age)})});game.morale=60;game.board=clamp(game.board+5,0,100);game.fansMood=60;addNews('Nova temporada iniciada. Convites continentais dependem da campanha na Série A.');chooseNextOpponent();saveGame(false);renderApp();}
    function saveGame(notify){club().cash=game.cash;localStorage.setItem(SAVE_KEY,JSON.stringify(game));if(notify)toast('Jogo salvo no navegador.');}
    function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return toast('Nenhum save encontrado.');game=JSON.parse(raw);game.currentView='dashboard';renderApp();toast('Save carregado.')}catch(e){console.error(e);toast('Save corrompido.')}}
    function deleteSave(){localStorage.removeItem(SAVE_KEY);toast('Save apagado.');renderStart();}
    function addNews(n){if(!game.news)game.news=[];game.news.unshift('📰 '+n);game.news=game.news.slice(0,30);}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
    function showModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('show');}
    function closeModal(){$('#modal').classList.remove('show');}
    function confirmModal(title,msg,cb){showModal(`<h2>${title}</h2><p>${msg}</p><div class="footer-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button id="confirmBtn">Confirmar</button></div>`);$('#confirmBtn').onclick=()=>{closeModal();cb();};}
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    window.initGame=initGame;window.createClubs=createClubs;window.createPlayers=createPlayers;window.renderDashboard=renderDashboard;window.renderSquad=renderSquad;window.renderTraining=renderTraining;window.renderMarket=renderMarket;window.renderFinances=renderFinances;window.simulateMatch=simulateMatch;window.updateLeagueTable=updateLeagueTable;window.nextSeason=nextSeason;window.saveGame=saveGame;window.loadGame=loadGame;
    initGame();
  </script>
</body>
</html>
