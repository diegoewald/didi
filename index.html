<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="FinançasPro V1.5 — controle financeiro local-first com IndexedDB, importação Excel/CSV e backups." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/financaspro.svg" />
    <title>FinançasPro V1.5</title>
    <script>
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('financaspro-settings') || '{}');
          var theme = cached.theme || 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          console.warn('Tema inicial não pôde ser aplicado.', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
