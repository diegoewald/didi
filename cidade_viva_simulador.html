<!doctype html>
<html lang="pt-BR">
<head>

<title>Cidade Viva Simulador</title>
<style>
:root{--bg:#07111f;--panel:rgba(13,26,45,.78);--panel2:rgba(20,38,64,.9);--cyan:#3df7ff;--pink:#ff4fd8;--green:#65ff9a;--yellow:#ffd35a;--red:#ff596e;--blue:#65a7ff;--muted:#9bb3c9;--text:#eef8ff;--grid:24px;--gap:3px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12345d 0,#07111f 34%,#040811 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent,rgba(61,247,255,.07),transparent);animation:sweep 9s linear infinite}@keyframes sweep{from{transform:translateX(-80%)}to{transform:translateX(80%)}}button,select,textarea,input{font:inherit}button{border:1px solid rgba(61,247,255,.25);background:linear-gradient(180deg,rgba(52,87,135,.9),rgba(13,28,54,.95));color:var(--text);border-radius:12px;padding:9px 11px;cursor:pointer;box-shadow:0 0 16px rgba(61,247,255,.12);transition:.18s}button:hover{transform:translateY(-1px);border-color:var(--cyan);box-shadow:0 0 20px rgba(61,247,255,.28)}button.active{background:linear-gradient(135deg,rgba(61,247,255,.32),rgba(255,79,216,.23));border-color:var(--cyan)}button.danger{border-color:rgba(255,89,110,.45)}button.good{border-color:rgba(101,255,154,.45)}.app{display:grid;grid-template-rows:auto 1fr;gap:14px;padding:14px}.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:260px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid rgba(61,247,255,.22);border-radius:20px;background:rgba(7,17,31,.82);backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.35)}.brand h1{margin:0;font-size:24px;letter-spacing:.5px;text-shadow:0 0 18px var(--cyan)}.brand small{color:var(--muted)}.indicators{display:grid;grid-template-columns:repeat(8,minmax(110px,1fr));gap:8px}.kpi{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08)}.kpi b{display:block;font-size:15px}.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase}.up{color:var(--green)}.down{color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.main{display:grid;grid-template-columns:310px minmax(560px,1fr) 360px;gap:14px}.panel{border:1px solid rgba(61,247,255,.18);border-radius:20px;background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.28);padding:14px;overflow:hidden}.panel h2,.panel h3{margin:0 0 10px}.left,.right{display:flex;flex-direction:column;gap:14px}.build-list{display:grid;gap:8px;max-height:58vh;overflow:auto;padding-right:3px}.build{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;text-align:left}.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08)}.build small{display:block;color:var(--muted);font-size:11px}.map-tools,.layers,.policies{display:flex;flex-wrap:wrap;gap:7px}.city-wrap{min-height:640px}.map-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.map{display:grid;grid-template-columns:repeat(20,var(--grid));grid-auto-rows:var(--grid);gap:var(--gap);justify-content:center;padding:16px;border-radius:22px;background:linear-gradient(145deg,rgba(25,42,69,.9),rgba(6,13,25,.9));border:1px solid rgba(101,167,255,.16);box-shadow:inset 0 0 45px rgba(0,0,0,.5);overflow:auto}.cell{position:relative;border-radius:6px;background:#152237;border:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.16s;overflow:hidden}.cell:hover{transform:scale(1.13);z-index:3;border-color:var(--cyan)}.cell.selected{outline:2px solid var(--yellow);box-shadow:0 0 18px var(--yellow);z-index:4}.cell:after{position:absolute;inset:3px;display:grid;place-items:center;font-size:13px}.empty{background:linear-gradient(135deg,#122136,#0e1829)}.road{background:#2d3441}.road:before{content:"";position:absolute;left:45%;top:0;width:10%;height:100%;background:repeating-linear-gradient(#ffd35a 0 4px,transparent 4px 8px)}.road .car{position:absolute;width:7px;height:4px;background:var(--cyan);border-radius:3px;top:5px;left:-8px;box-shadow:0 0 8px var(--cyan);animation:car 2.8s linear infinite}@keyframes car{to{left:110%}}.residential{background:linear-gradient(#4d79ff,#20396d)}.residential:after{content:"🏠"}.commercial{background:linear-gradient(#2cffc9,#107b7c)}.commercial:after{content:"🏪"}.industrial{background:linear-gradient(#8f6b45,#3e3027)}.industrial:after{content:"🏭"}.industrial:before{content:"";position:absolute;width:8px;height:8px;background:rgba(180,180,180,.55);border-radius:50%;right:4px;top:2px;animation:smoke 2s infinite}@keyframes smoke{to{transform:translateY(-13px) scale(1.9);opacity:0}}.power{background:linear-gradient(#ffe66b,#935c00)}.power:after{content:"⚡"}.water{background:linear-gradient(#4de1ff,#095887)}.water:after{content:"💧"}.firestation{background:linear-gradient(#ff596e,#7b101e)}.firestation:after{content:"🚒"}.firestation:before{content:"";position:absolute;inset:0;border:2px solid red;border-radius:6px;animation:pulse 1s infinite}.hospital{background:linear-gradient(#fff,#589cff)}.hospital:after{content:"🏥"}.school{background:linear-gradient(#ffe27a,#7b5c00)}.school:after{content:"🎓"}.police{background:linear-gradient(#8ab5ff,#142b88)}.police:after{content:"👮"}.park{background:linear-gradient(#5dff85,#136b2a)}.park:after{content:"🌳"}.landfill{background:linear-gradient(#776d5d,#302b24)}.landfill:after{content:"🗑️"}.bus{background:linear-gradient(#ff9f43,#8a3c00)}.bus:after{content:"🚌"}.cityhall{background:linear-gradient(135deg,#ff4fd8,#3df7ff)}.cityhall:after{content:"🏛️"}.building{box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),0 0 12px rgba(61,247,255,.1)}.state-building{filter:saturate(.7)}.st-building:before{content:"…";position:absolute;color:#fff;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25)}.no-power{box-shadow:inset 0 0 0 2px #ffe66b}.no-water{box-shadow:inset 0 0 0 2px #4de1ff}.full{outline:2px dashed var(--pink)}.abandoned{filter:grayscale(1) brightness(.5)}.risk{box-shadow:0 0 14px var(--yellow),inset 0 0 0 2px var(--yellow)}.burning{animation:burn .55s infinite alternate;box-shadow:0 0 22px var(--red)}.burning:after{content:"🔥"}@keyframes burn{from{filter:hue-rotate(0)}to{filter:hue-rotate(-35deg) brightness(1.35)}}@keyframes pulse{50%{opacity:.2}}.overlay-low{box-shadow:inset 0 0 0 999px rgba(101,255,154,.32)}.overlay-mid{box-shadow:inset 0 0 0 999px rgba(255,211,90,.34)}.overlay-high{box-shadow:inset 0 0 0 999px rgba(255,141,61,.38)}.overlay-crit{box-shadow:inset 0 0 0 999px rgba(255,89,110,.45)}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--muted)}.row b{color:var(--text)}.alerts{display:grid;gap:7px}.alert{padding:9px 10px;border-radius:12px;background:rgba(255,211,90,.09);border:1px solid rgba(255,211,90,.22)}.alert.bad{background:rgba(255,89,110,.1);border-color:rgba(255,89,110,.25)}.mission{margin:8px 0;padding:9px;border-radius:13px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07)}.bar{height:8px;background:rgba(255,255,255,.09);border-radius:20px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:20px}.history{max-height:235px;overflow:auto;font-size:12px}.hist{padding:8px;border-left:3px solid var(--cyan);background:rgba(255,255,255,.04);margin-bottom:7px;border-radius:8px}.charts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:110px}.chartcol{display:flex;align-items:end;justify-content:center;gap:2px;height:90px;border-bottom:1px solid rgba(255,255,255,.12)}.chartbar{width:8px;min-height:2px;border-radius:5px 5px 0 0;background:linear-gradient(var(--cyan),var(--pink));box-shadow:0 0 8px rgba(61,247,255,.4)}.importbox{width:100%;min-height:70px;background:#07111f;color:var(--text);border:1px solid rgba(61,247,255,.2);border-radius:12px;padding:8px}.locked{opacity:.45;filter:grayscale(.6)}@media(max-width:1280px){.main{grid-template-columns:280px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr)}.indicators{grid-template-columns:repeat(4,1fr)}}@media(max-width:860px){.top,.main{grid-template-columns:1fr}.right{display:flex}.indicators{grid-template-columns:repeat(2,1fr)}:root{--grid:20px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><h1>🌆 Cidade Viva</h1><small id="dateLevel">Vila • Jan/2026</small></div><div class="indicators" id="indicators"></div><div class="actions"><button id="simulateBtn" class="good">Simular mês</button><button id="saveBtn">Salvar</button><button id="loadBtn">Carregar</button><button id="exportBtn">Exportar</button><button id="importBtn">Importar</button><button id="newBtn" class="danger">Novo jogo</button></div></header><main class="main"><aside class="left"><section class="panel"><h2>Construções</h2><div class="build-list" id="buildList"></div></section><section class="panel"><h3>Camadas de dados</h3><div class="layers" id="layers"></div></section><section class="panel"><h3>Save import/export</h3><textarea id="saveText" class="importbox" placeholder="Cole ou copie seu save aqui"></textarea></section></aside><section class="panel city-wrap"><div class="map-head"><div><h2>Mapa urbano 20×20</h2><small id="selectedTool">Selecione uma construção e clique no mapa.</small></div><div class="map-tools"><button id="bulldozeBtn">Demolir</button><button id="eventBtn">Forçar evento</button><button id="fireBtn">Teste incêndio</button></div></div><div id="map" class="map"></div></section><aside class="right"><section class="panel"><h3>Célula selecionada</h3><div id="cellDetails" class="rows"></div><h3>Políticas</h3><div id="policies" class="policies"></div></section><section class="panel"><h3>Alertas e eventos</h3><div id="alerts" class="alerts"></div><div id="events"></div></section><section class="panel"><h3>Missões</h3><div id="missions"></div></section><section class="panel"><h3>Relatórios mensais</h3><div id="history" class="history"></div></section><section class="panel"><h3>Gráficos</h3><div class="charts" id="charts"></div></section></aside></main></div>
<script>
'use strict';
const W=20,H=20,SAVE_KEY='cidadeVivaSaveV1';
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const money=v=>'₡ '+Math.round(v).toLocaleString('pt-BR');
const pct=v=>Math.round(v)+'%';
const BUILDINGS={empty:{name:'Vazio',icon:'⬚',cost:0,maint:0,energy:0,water:0,jobs:0,popMax:0,happy:0,pollution:0,traffic:0,land:0,roadCap:0,unlock:0},road:{name:'Rua',icon:'═',cost:25,maint:1,energy:0,water:0,jobs:0,popMax:0,happy:0,pollution:0,traffic:-2,land:4,roadCap:45,unlock:0},residential:{name:'Residência',icon:'🏠',cost:180,maint:4,energy:2,water:3,jobs:0,popMax:45,happy:1,pollution:1,traffic:4,land:3,unlock:0},commercial:{name:'Comércio',icon:'🏪',cost:320,maint:8,energy:6,water:4,jobs:32,popMax:0,happy:2,pollution:2,traffic:9,land:5,unlock:0},industrial:{name:'Indústria',icon:'🏭',cost:520,maint:16,energy:13,water:9,jobs:90,popMax:0,happy:-2,pollution:12,traffic:18,land:-8,unlock:0},power:{name:'Usina',icon:'⚡',cost:760,maint:42,energy:-130,water:5,jobs:16,popMax:0,happy:-1,pollution:9,traffic:5,land:-6,unlock:0},water:{name:'Caixa d’água',icon:'💧',cost:520,maint:24,energy:3,water:-150,jobs:6,popMax:0,happy:1,pollution:0,traffic:2,land:2,unlock:0},firestation:{name:'Bombeiro',icon:'🚒',cost:900,maint:55,energy:8,water:7,jobs:28,popMax:0,happy:4,pollution:0,traffic:3,land:8,radius:5,unlock:1},hospital:{name:'Hospital',icon:'🏥',cost:1300,maint:90,energy:14,water:12,jobs:55,popMax:0,happy:6,pollution:1,traffic:6,land:10,radius:6,unlock:1},school:{name:'Escola',icon:'🎓',cost:950,maint:60,energy:8,water:6,jobs:34,popMax:0,happy:5,pollution:0,traffic:5,land:8,radius:6,unlock:1},police:{name:'Polícia',icon:'👮',cost:1050,maint:65,energy:9,water:5,jobs:35,popMax:0,happy:4,pollution:0,traffic:4,land:9,radius:6,unlock:2},park:{name:'Parque',icon:'🌳',cost:360,maint:18,energy:1,water:8,jobs:5,popMax:0,happy:7,pollution:-7,traffic:-2,land:13,radius:4,unlock:0},landfill:{name:'Aterro',icon:'🗑️',cost:700,maint:34,energy:4,water:2,jobs:22,popMax:0,happy:-5,pollution:16,traffic:8,land:-12,radius:5,unlock:2},bus:{name:'Terminal de ônibus',icon:'🚌',cost:1100,maint:72,energy:10,water:4,jobs:26,popMax:0,happy:3,pollution:-2,traffic:-18,land:7,radius:7,unlock:2},cityhall:{name:'Prefeitura',icon:'🏛️',cost:1800,maint:80,energy:12,water:8,jobs:45,popMax:0,happy:7,pollution:0,traffic:4,land:16,radius:8,unlock:1}};
const LEVELS=[['Vila',0,0,0],['Cidade pequena',300,55,600],['Cidade média',1000,60,1200],['Cidade grande',3000,62,2500],['Capital',7000,65,6000],['Metrópole',14000,68,12000],['Megalópole',26000,72,24000]];
const LAYERS=['normal','valor do terreno','trânsito','incêndio','serviços','poluição','acesso viário','água','energia'];
const EVENTS=[['Seca','Consumo de água sobe e felicidade cai',3],['Onda de calor','Risco de incêndio e água sobem',2],['Incêndio industrial','Uma indústria pode pegar fogo',1],['Crise econômica','Receita e demanda comercial caem',3],['Festival local','Felicidade e comércio sobem',1],['Demanda comercial','Comércio vende mais',2],['Greve de serviços','Serviços públicos perdem eficiência',2],['Apagão','Produção de energia temporariamente menor',1],['Epidemia leve','Saúde e crescimento caem',2],['Crescimento migratório','Mais famílias chegam se houver moradia',1]];
const POLICIES={taxLow:'Imposto baixo',taxMid:'Imposto médio',taxHigh:'Imposto alto',industry:'Incentivo industrial',green:'Cidade verde',transport:'Prioridade transporte',security:'Campanha segurança',education:'Educação forte'};
const MISSIONS=[['Construir 5 residências',s=>count('residential')/5,500],['Alcançar 500 habitantes',s=>s.population/500,700],['Felicidade acima de 70%',s=>s.metrics.happiness/70,450],['Construir bombeiro',s=>count('firestation'),800],['Trânsito abaixo de 35%',s=>s.metrics.traffic?1-s.metrics.traffic/35:1,600],['Saldo mensal positivo',s=>s.metrics.balance>0?1:0,700],['Atingir Cidade Média',s=>s.level>=2?1:0,1200],['Água e energia positivas por 6 meses',s=>s.safeMonths/6,1300],['Reduzir risco de incêndio',s=>1-s.metrics.fireRisk/30,900],['Alcançar Metrópole',s=>s.level>=5?1:0,5000]];
let state,tool='road',layer='normal',selected=null;
function fresh(){return{money:4200,population:80,month:0,year:2026,level:0,tax:.08,policies:{taxMid:true},grid:Array.from({length:W*H},(_,i)=>({id:'c'+i,x:i%W,y:Math.floor(i/W),type:'empty',state:'normal',age:0,land:50,traffic:0,pollution:0,service:0,access:0,fire:0})),metrics:{},history:[],events:[],alerts:[],completed:{},safeMonths:0,lastEvent:'Nenhum'}}
function cells(){return state.grid} function count(t){return cells().filter(c=>c.type===t).length} function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)} function nearRoad(c){return cells().some(o=>o.type==='road'&&dist(c,o)<=1)} function coverage(c,types,rad){return cells().filter(o=>types.includes(o.type)&&dist(c,o)<=((BUILDINGS[o.type].radius)||rad)).length}
function init(){state=load()||fresh(); calc(); renderAll(); setInterval(()=>save(false),15000)}
function calc(){let m={};let b=cells().map(c=>BUILDINGS[c.type]);m.popMax=b.reduce((a,x)=>a+x.popMax,0);m.jobs=b.reduce((a,x)=>a+x.jobs,0);m.energyProd=-b.filter(x=>x.energy<0).reduce((a,x)=>a+x.energy,0);m.energyUse=b.filter(x=>x.energy>0).reduce((a,x)=>a+x.energy,0);m.waterProd=-b.filter(x=>x.water<0).reduce((a,x)=>a+x.water,0);m.waterUse=b.filter(x=>x.water>0).reduce((a,x)=>a+x.water,0);let roads=count('road'),intersections=cells().filter(c=>c.type==='road'&&cells().filter(o=>o.type==='road'&&dist(c,o)===1).length>2).length;let vehicles=state.population*.35+count('commercial')*18+count('industrial')*38;let cap=roads*45+count('bus')*160+1;let cross=1+intersections/90; m.traffic=clamp((vehicles/cap*cross)*100,0,100);m.pollution=clamp(b.reduce((a,x)=>a+x.pollution,0)+m.traffic*.09-count('park')*3,0,100);let servicePts=count('hospital')*9+count('school')*8+count('police')*8+count('firestation')*7+count('bus')*5; m.health=clamp(45+count('hospital')*14-count('landfill')*4-m.pollution*.22,0,100);m.education=clamp(35+count('school')*15+(state.policies.education?12:0),0,100);m.security=clamp(45+count('police')*16-(state.population/900),0,100);m.unemployment=clamp(((state.population*.5-m.jobs)/Math.max(1,state.population*.5))*100,0,100);let falta=(m.energyUse>m.energyProd?15:0)+(m.waterUse>m.waterProd?15:0);let taxPenalty=state.tax*180;let leisure=count('park')*4;let emp=18-m.unemployment*.35;m.happiness=clamp(50+servicePts*.9+emp+leisure+m.health*.08+m.education*.06+m.security*.07-m.traffic*.18-m.pollution*.22-taxPenalty-falta,0,100);let modHappy=.7+m.happiness/150, modEco=1+(m.education-50)/250+(count('commercial')/30)-(m.traffic/260); if(active('Crise econômica'))modEco*=.75;if(active('Demanda comercial'))modEco*=1.18;m.revenue=Math.round(state.population*state.tax*10*modHappy*modEco+count('commercial')*28+count('industrial')*18);m.expense=Math.round(b.reduce((a,x)=>a+x.maint,0)+servicePts*2+(falta?80:0)+(state.policies.green?55:0)+(state.policies.transport?50:0)+(state.policies.security?45:0)+(state.policies.education?55:0));m.balance=m.revenue-m.expense;let fireCov=count('firestation')?clamp(count('firestation')*.22+count('road')/260,0,.85):0;let secura=1+(active('Seca')||active('Onda de calor')?.35:0);m.fireRisk=clamp((state.population/900+count('industrial')*5+count('landfill')*2)*secura*(1-fireCov)+m.traffic*.05,0,100);m.landValue=0;m.comDemand=Math.round(state.population*(1+m.education/100)*(1-m.traffic/160)*(m.happiness/80));m.indProduction=Math.round(m.jobs*(m.energyUse<=m.energyProd?1:.45)*(m.waterUse<=m.waterProd?1:.45)*(1-m.traffic/180));cells().forEach(c=>{let access=nearRoad(c)?80:25,serv=coverage(c,['hospital','school','police','firestation','bus'],6)*12,laz=coverage(c,['park'],4)*16,poll=coverage(c,['industrial','landfill','power'],4)*12,crime=100-m.security,noise=coverage(c,['road','industrial'],2)*4;c.access=access;c.service=clamp(serv,0,100);c.pollution=clamp(BUILDINGS[c.type].pollution*6+poll-laz*.4,0,100);c.traffic=clamp((BUILDINGS[c.type].traffic+vehicles/(W*H))*2+(nearRoad(c)?m.traffic*.35:m.traffic*.75),0,100);c.land=clamp(40+access*.22+serv*.35+laz*.45-c.pollution*.45-crime*.16-noise,0,100);c.fire=clamp((c.type==='industrial'?45:10)+c.pollution*.25+m.fireRisk*.4-(coverage(c,['firestation'],5)*25),0,100);if(c.type!=='empty'&&c.type!=='road'){c.state='normal'; if(m.energyUse>m.energyProd&&BUILDINGS[c.type].energy>0)c.state='no-power'; if(m.waterUse>m.waterProd&&BUILDINGS[c.type].water>0)c.state='no-water'; if(c.fire>55)c.state='risk'; if(c.state==='burning')c.state='burning'; if(state.population>=m.popMax&&c.type==='residential')c.state='full'; if(!nearRoad(c)&&!['park','water','power'].includes(c.type))c.state='abandoned';}});m.landValue=Math.round(cells().reduce((a,c)=>a+c.land,0)/cells().length);state.metrics=m;return m}
function active(n){return state.events.some(e=>e.name===n&&e.left>0)}
function build(c){if(tool==='bulldoze'){if(c.type!=='empty'){state.money+=Math.floor(BUILDINGS[c.type].cost*.12);Object.assign(c,{type:'empty',state:'normal'});log('Demolição concluída em '+c.id)}return after()}let def=BUILDINGS[tool];if(!def)return;if(c.type!=='empty')return alertMsg('Célula ocupada. Demola antes.',true);if(state.level<def.unlock)return alertMsg('Construção bloqueada pelo nível da cidade.',true);if(state.money<def.cost)return alertMsg('Dinheiro insuficiente para '+def.name,true);state.money-=def.cost;c.type=tool;c.state='building';c.age=0;setTimeout(()=>{if(c.state==='building')c.state='normal';renderMap()},450);log(def.name+' construída em '+c.id);after()}
function simulate(forceEvent=false){state.month++; if(state.month>=12){state.month=0;state.year++}state.events.forEach(e=>e.left--);state.events=state.events.filter(e=>e.left>0);let beforePop=state.population;let m=calc();let recursos=m.energyUse<=m.energyProd&&m.waterUse<=m.waterProd?1:0;let livre=Math.max(0,m.popMax-state.population)/Math.max(1,m.popMax);let empLivre=Math.max(0,m.jobs-state.population*.5+40)/Math.max(40,m.jobs+40);let growth=Math.round(85*livre*empLivre*recursos*(m.happiness/100));if(active('Crescimento migratório'))growth+=Math.round(70*livre);if(active('Epidemia leve'))growth-=20;state.population=clamp(state.population+growth,0,m.popMax);calc();state.money+=state.metrics.balance;if(state.metrics.energyProd>=state.metrics.energyUse&&state.metrics.waterProd>=state.metrics.waterUse)state.safeMonths++;else state.safeMonths=0;if(forceEvent||Math.random()<.28)randomEvent();handleFire();updateLevel();checkMissions();let problem=mainProblem(),improve=state.population>beforePop?'População cresceu':state.metrics.balance>0?'Caixa positivo':'Serviços estáveis';state.history.unshift({date:dateStr(),pop:state.population,money:state.money,hap:state.metrics.happiness,rev:state.metrics.revenue,exp:state.metrics.expense,bal:state.metrics.balance,problem,improve,event:state.lastEvent});state.history=state.history.slice(0,36);log('Mês simulado: '+problem+'; '+improve);after()}
function handleFire(){let burn=cells().filter(c=>c.state==='burning'); if(burn.length===0&&Math.random()<state.metrics.fireRisk/160){let cand=cells().filter(c=>!['empty','road','park'].includes(c.type)).sort((a,b)=>b.fire-a.fire)[0]; if(cand){cand.state='burning';alertMsg('🔥 Incêndio em '+BUILDINGS[cand.type].name,true)}}burn.forEach(c=>{let eta=(10/(1+coverage(c,['firestation'],5)))*(1+state.metrics.traffic/80); if(eta<7){c.state='risk';alertMsg('🚒 Bombeiros controlaram incêndio em '+c.id,false)}else{state.money-=150;state.metrics.happiness=clamp(state.metrics.happiness-5,0,100);if(Math.random()<.25){c.type='empty';c.state='normal';alertMsg('🔥 Construção destruída pelo fogo!',true)}}})}
function randomEvent(){let e=EVENTS[Math.floor(Math.random()*EVENTS.length)];state.events.push({name:e[0],desc:e[1],left:e[2]});state.lastEvent=e[0];if(e[0]==='Festival local')state.money+=200;if(e[0]==='Apagão')state.metrics.energyProd=Math.max(0,state.metrics.energyProd-50);if(e[0]==='Incêndio industrial'){let i=cells().find(c=>c.type==='industrial');if(i)i.state='burning'}alertMsg('Evento: '+e[0]+' — '+e[1],e[0].includes('Incêndio')||e[0].includes('Crise')||e[0].includes('Apagão'))}
function updateLevel(){let idx=state.level;LEVELS.forEach((l,i)=>{if(state.population>=l[1]&&state.metrics.happiness>=l[2]&&state.money>=l[3])idx=i});if(idx>state.level){state.level=idx;state.money+=idx*450;alertMsg('🏙️ Novo nível: '+LEVELS[idx][0]+'! Bônus liberado.',false)}}
function checkMissions(){MISSIONS.forEach((mi,i)=>{if(!state.completed[i]&&mi[1](state)>=1){state.completed[i]=true;state.money+=mi[2];alertMsg('🎯 Missão concluída: '+mi[0]+' +'+money(mi[2]),false)}})}
function mainProblem(){let m=state.metrics;if(m.waterUse>m.waterProd)return'Falta de água';if(m.energyUse>m.energyProd)return'Falta de energia';if(m.traffic>65)return'Trânsito crítico';if(m.fireRisk>55)return'Risco de incêndio';if(m.happiness<45)return'Baixa felicidade';if(m.balance<0)return'Saldo negativo';return'Cidade estável'}
function dateStr(){return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][state.month]+'/'+state.year}
function log(t){state.alerts.unshift({t,date:dateStr(),bad:false});state.alerts=state.alerts.slice(0,8)}function alertMsg(t,bad){state.alerts.unshift({t,date:dateStr(),bad});state.alerts=state.alerts.slice(0,8);renderPanels();save(false)}
function after(){calc();renderAll();save(false)} function save(notify=true){localStorage.setItem(SAVE_KEY,JSON.stringify(state));if(notify)alertMsg('Jogo salvo localmente.',false)} function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){return null}}
function renderAll(){renderBuilds();renderLayers();renderPolicies();renderMap();renderPanels()} 
function renderBuilds(){buildList.innerHTML='';Object.entries(BUILDINGS).filter(([k])=>k!=='empty').forEach(([k,d])=>{let bt=document.createElement('button');bt.className='build '+(tool===k?'active ':'')+(state.level<d.unlock?'locked':'');bt.title=`Custo ${money(d.cost)} | Manut. ${money(d.maint)} | Energia ${d.energy} | Água ${d.water} | Empregos ${d.jobs} | Pop máx ${d.popMax}`;bt.innerHTML=`<span class="ico">${d.icon}</span><span><b>${d.name}</b><small>${money(d.cost)} • Emp ${d.jobs} • Pop ${d.popMax} • Pol ${d.pollution}</small></span><b>${state.level<d.unlock?'🔒':'+'}</b>`;bt.onclick=()=>{tool=k;selectedTool.textContent='Ferramenta: '+d.name+' — '+bt.title;renderBuilds()};buildList.appendChild(bt)})}
function renderLayers(){layers.innerHTML='';LAYERS.forEach(l=>{let b=document.createElement('button');b.textContent=l;b.className=layer===l?'active':'';b.onclick=()=>{layer=l;renderLayers();renderMap()};layers.appendChild(b)})}
function renderPolicies(){let unlocked=count('cityhall')>0;policies.innerHTML='';Object.entries(POLICIES).forEach(([k,n])=>{let b=document.createElement('button');b.textContent=unlocked?n:'🔒 '+n;b.disabled=!unlocked;b.className=state.policies[k]?'active':'';b.onclick=()=>{if(k.startsWith('tax')){state.policies.taxLow=state.policies.taxMid=state.policies.taxHigh=false;state.tax=k==='taxLow'?.05:k==='taxHigh'?.14:.08}state.policies[k]=!state.policies[k]||k.startsWith('tax');after()};policies.appendChild(b)})}
function renderMap(){map.innerHTML='';cells().forEach(c=>{let d=document.createElement('div');d.className='cell '+c.type+' '+(c.type!=='empty'?'building ':'')+stateClass(c)+' '+overlay(c)+(selected&&selected.id===c.id?' selected':'');d.title=`${c.id} ${BUILDINGS[c.type].name} | Valor ${Math.round(c.land)} | Trânsito ${Math.round(c.traffic)} | Fogo ${Math.round(c.fire)}`;if(c.type==='road')d.innerHTML='<i class="car"></i>';d.onclick=()=>{selected=c;build(c)};d.oncontextmenu=e=>{e.preventDefault();selected=c;renderPanels();renderMap()};map.appendChild(d)})}
function stateClass(c){return{building:'st-building','no-power':'no-power','no-water':'no-water',full:'full',abandoned:'abandoned',risk:'risk',burning:'burning'}[c.state]||''}
function ov(v){return v<30?'overlay-low':v<55?'overlay-mid':v<78?'overlay-high':'overlay-crit'}function overlay(c){if(layer==='normal')return'';if(layer==='valor do terreno')return ov(c.land);if(layer==='trânsito')return ov(c.traffic);if(layer==='incêndio')return ov(c.fire);if(layer==='serviços')return ov(c.service);if(layer==='poluição')return ov(c.pollution);if(layer==='acesso viário')return ov(c.access);if(layer==='água')return ov(BUILDINGS[c.type].water>0&&state.metrics.waterUse>state.metrics.waterProd?80:20);if(layer==='energia')return ov(BUILDINGS[c.type].energy>0&&state.metrics.energyUse>state.metrics.energyProd?80:20);return''}
function renderPanels(){let m=state.metrics;dateLevel.textContent=LEVELS[state.level][0]+' • '+dateStr();let vals=[['Dinheiro',money(state.money)],['População',Math.round(state.population)+'/'+m.popMax],['Felicidade',pct(m.happiness)],['Imposto',pct(state.tax*100)],['Receita',money(m.revenue)],['Despesa',money(m.expense)],['Saldo',money(m.balance)],['Energia',m.energyProd+'/'+m.energyUse],['Água',m.waterProd+'/'+m.waterUse],['Empregos',m.jobs],['Desemprego',pct(m.unemployment)],['Trânsito',pct(m.traffic)],['Poluição',pct(m.pollution)],['Saúde',pct(m.health)],['Educação',pct(m.education)],['Segurança',pct(m.security)],['Incêndio',pct(m.fireRisk)],['Valor terreno',Math.round(m.landValue)]];indicators.innerHTML=vals.map(([a,b])=>`<div class="kpi"><span>${a}</span><b class="${String(b).includes('-')?'down':'up'}">${b}</b></div>`).join('');let c=selected||cells()[0];cellDetails.innerHTML=`<div class="row"><span>ID</span><b>${c.id}</b></div><div class="row"><span>Tipo</span><b>${BUILDINGS[c.type].name}</b></div><div class="row"><span>Estado</span><b>${c.state}</b></div><div class="row"><span>Rua próxima</span><b>${nearRoad(c)?'Sim':'Não'}</b></div><div class="row"><span>Valor</span><b>${Math.round(c.land)}</b></div><div class="row"><span>Trânsito local</span><b>${pct(c.traffic)}</b></div><div class="row"><span>ETA bombeiro</span><b>${Math.round((10/(1+coverage(c,['firestation'],5)))*(1+m.traffic/80))} min</b></div>`;alerts.innerHTML=state.alerts.map(a=>`<div class="alert ${a.bad?'bad':''}"><b>${a.date}</b> ${a.t}</div>`).join('')||'<div class="alert">Sem alertas.</div>';events.innerHTML=state.events.map(e=>`<div class="row"><span>${e.name}</span><b>${e.left}m</b></div>`).join('');missions.innerHTML=MISSIONS.map((mi,i)=>{let p=clamp(mi[1](state),0,1);return`<div class="mission"><b>${state.completed[i]?'✅ ':'🎯 '}${mi[0]}</b><small> recompensa ${money(mi[2])}</small><div class="bar"><i style="width:${p*100}%"></i></div></div>`}).join('');history.innerHTML=state.history.map(h=>`<div class="hist"><b>${h.date}</b> Pop ${Math.round(h.pop)} • ${money(h.money)} • Fel ${pct(h.hap)}<br>Rec ${money(h.rev)} Desp ${money(h.exp)} Saldo ${money(h.bal)}<br>Problema: ${h.problem} • Melhoria: ${h.improve} • Evento: ${h.event}</div>`).join('');renderCharts()}
function renderCharts(){let keys=[['pop','Pop'],['money','₡'],['hap','Fel'],['traffic','Trâ'],['fire','Fogo']];let hist=state.history.slice(0,12).reverse();charts.innerHTML=keys.map(([k,n])=>`<div><small>${n}</small><div class="chartcol">${hist.map(h=>{let v=k==='traffic'?state.metrics.traffic:k==='fire'?state.metrics.fireRisk:h[k];let max=k==='money'?10000:k==='pop'?5000:100;return`<i class="chartbar" style="height:${clamp(v/max*88,2,88)}px"></i>`}).join('')}</div></div>`).join('')}
function exportSave(){saveText.value=btoa(unescape(encodeURIComponent(JSON.stringify(state))));alertMsg('Save exportado para a caixa de texto.',false)}function importSave(){try{let s=JSON.parse(decodeURIComponent(escape(atob(saveText.value.trim()))));if(!s.grid||s.grid.length!==W*H)throw Error('save inválido');state=s;after();alertMsg('Save importado.',false)}catch(e){alertMsg('Falha ao importar save.',true)}}
simulateBtn.onclick=()=>simulate();saveBtn.onclick=()=>save();loadBtn.onclick=()=>{let s=load();if(s){state=s;after();alertMsg('Jogo carregado.',false)}};exportBtn.onclick=exportSave;importBtn.onclick=importSave;newBtn.onclick=()=>{if(confirm('Começar uma nova cidade?')){state=fresh();after()}};bulldozeBtn.onclick=()=>{tool='bulldoze';selectedTool.textContent='Ferramenta: demolir'};eventBtn.onclick=()=>simulate(true);fireBtn.onclick=()=>{let c=cells().find(x=>!['empty','road'].includes(x.type));if(c){c.state='burning';after()}};
init();
</script>
</body>
